<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0A0612"/>
<title>Jaguars · Player Development</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0612; --card:#140B20; --card2:#251539; --head:#1a1030;
    --pur:#8B43E0; --pur-br:#A66BF2; --pur-dp:#5B21B6; --pur-soft:rgba(139,67,224,.12);
    --gold:#E3AE33; --gold-br:#F4C84B;
    --tx:#fff; --tx-s:rgba(255,255,255,.78); --tx-m:rgba(255,255,255,.55); --tx-d:rgba(255,255,255,.32);
    --line:rgba(255,255,255,.10); --line-s:rgba(255,255,255,.055);
    --disp:'Anton',system-ui,sans-serif; --sans:'Inter',system-ui,-apple-system,sans-serif;
    --maxw:1240px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{font-family:var(--sans);color:var(--tx);line-height:1.5;min-height:100vh;overflow-x:hidden;
    background:radial-gradient(1200px 700px at 80% -10%,rgba(139,67,224,.18),transparent 60%),
               radial-gradient(900px 600px at -10% 10%,rgba(227,174,51,.08),transparent 55%),var(--bg);
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit}

  .bar{position:sticky;top:0;z-index:80;background:rgba(10,6,18,.82);backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);border-bottom:1px solid var(--line)}
  .bar-in{max-width:var(--maxw);margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:14px}
  .mark{display:flex;align-items:center;gap:11px;min-width:0}
  .mark-badge{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--pur),var(--pur-dp));box-shadow:0 8px 18px -7px var(--pur)}
  .mark-txt b{font-family:var(--disp);font-size:1.02rem;letter-spacing:.06em;display:block;line-height:1}
  .mark-txt span{font-size:.7rem;color:var(--gold-br);letter-spacing:.02em}
  .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);
    background:rgba(255,255,255,.03);font-size:.76rem;font-weight:700;white-space:nowrap}
  .pill .dot{width:8px;height:8px;border-radius:50%;background:#39d98a;box-shadow:0 0 8px #39d98a}

  .tabs{position:sticky;top:61px;z-index:70;background:rgba(10,6,18,.74);backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line-s)}
  .tabs-in{max-width:var(--maxw);margin:0 auto;padding:0 12px;display:flex;gap:4px;overflow-x:auto}
  .tab{padding:13px 15px;font-size:.8rem;font-weight:800;letter-spacing:.04em;color:var(--tx-m);
    white-space:nowrap;border-bottom:2.5px solid transparent;text-transform:uppercase;transition:.15s}
  .tab:hover{color:var(--tx-s)} .tab.on{color:var(--tx);border-bottom-color:var(--pur)}
  main{max-width:var(--maxw);margin:0 auto;padding:22px 16px 80px}

  .sec{display:flex;align-items:center;gap:12px;margin:2px 2px 16px;flex-wrap:wrap}
  .sec h2{font-family:var(--disp);font-size:1.5rem;letter-spacing:.03em}
  .sec .rule{flex:1;height:1px;background:var(--line);min-width:20px}
  .lead{color:var(--tx-m);margin:-8px 2px 16px;font-size:.9rem}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:10px;
    font-weight:800;font-size:.83rem;transition:.15s;white-space:nowrap}
  .btn-p{background:linear-gradient(135deg,var(--pur),var(--pur-dp));color:#fff;box-shadow:0 10px 22px -10px var(--pur)}
  .btn-p:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .btn-g{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--tx-s)}
  .btn-g:hover{border-color:var(--pur);color:var(--pur-br)}
  .btn-s{padding:7px 12px;font-size:.75rem;border-radius:8px}
  .btn-block{width:100%}
  .btn-dz{color:#ff7a7a;border-color:rgba(255,122,122,.3)}

  .gradebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 2px 16px}
  .gl{font-size:.65rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-m)}
  .gchip{min-width:34px;padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);
    color:var(--tx-m);font-size:.8rem;font-weight:800;transition:.12s}
  .gchip:hover{border-color:var(--pur);color:#fff}
  .gchip.on{background:linear-gradient(135deg,var(--pur),var(--pur-dp));border-color:transparent;color:#fff}

  /* ==== player card ==== */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
  .pcard{position:relative;border-radius:16px;overflow:hidden;cursor:pointer;transition:.16s;
    border:1px solid var(--line);background:linear-gradient(160deg,#1d1030,#100a1b)}
  .pcard:hover{transform:translateY(-3px);border-color:rgba(166,107,242,.55)}
  .pcard.t-elite{border-color:rgba(244,200,75,.5);background:linear-gradient(160deg,#2a1e12,#120c1c)}
  .pcard-top{display:flex;align-items:center;gap:12px;padding:14px 15px 10px}
  .jersey{width:52px;height:52px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;
    font-family:var(--disp);font-size:1.5rem;background:var(--card2);border:1px solid var(--line)}
  .pname{font-weight:800;font-size:1.05rem;line-height:1.15}
  .pmeta{font-size:.7rem;color:var(--tx-d);font-weight:600;margin-top:2px}
  .ovr{margin-left:auto;text-align:center;line-height:1}
  .ovr b{font-family:var(--disp);font-size:2.5rem;display:block}
  .ovr span{font-size:.58rem;font-weight:900;letter-spacing:.18em;color:var(--tx-d)}
  .bars{padding:4px 15px 14px;display:grid;gap:7px}
  .brow{display:grid;grid-template-columns:76px 1fr 34px;align-items:center;gap:9px}
  .blab{font-size:.66rem;font-weight:700;color:var(--tx-m);text-transform:uppercase;letter-spacing:.04em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btrack{height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
  .bfill{height:100%;border-radius:99px;transition:width .5s ease}
  .bval{font-family:var(--disp);font-size:.95rem;text-align:right}
  .delta{font-size:.62rem;font-weight:800;margin-left:3px}
  .up{color:#5ee6a0} .down{color:#ff8080} .flat{color:var(--tx-d)}
  .prov{position:absolute;top:12px;right:12px;font-size:.54rem;font-weight:900;letter-spacing:.1em;
    color:var(--gold-br);border:1px solid rgba(227,174,51,.45);border-radius:5px;padding:2px 6px;background:rgba(0,0,0,.35)}

  /* ==== tables / grids ==== */
  .wrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%}
  th{position:sticky;top:0;background:var(--head);font-size:.63rem;font-weight:800;letter-spacing:.07em;
    text-transform:uppercase;color:var(--tx-m);padding:11px 8px;text-align:center;white-space:nowrap;
    border-bottom:1px solid var(--line);z-index:2}
  th.l{text-align:left;padding-left:14px}
  td{padding:0;text-align:center;border-bottom:1px solid var(--line-s)}
  tbody tr:hover{background:rgba(255,255,255,.025)}
  tbody tr:last-child td{border-bottom:none}
  .cell{padding:9px 8px;font-weight:700;font-size:.9rem}
  .cell.l{text-align:left;padding-left:14px}
  .nin{width:66px;padding:7px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);
    color:#fff;font-weight:800;font-size:.88rem;text-align:center}
  .nin:focus{outline:none;border-color:var(--pur);background:var(--pur-soft)}
  .nin.filled{border-color:rgba(94,230,160,.4)}

  .field{margin-bottom:12px}
  .field label{display:block;font-size:.64rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:var(--tx-m);margin-bottom:5px}
  .inp{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);
    color:#fff;font-size:.92rem;font-weight:600}
  .inp:focus{outline:none;border-color:var(--pur);background:var(--pur-soft)}
  .inp::placeholder{color:var(--tx-d)}
  select.inp{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:34px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23A66BF2' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center}
  select.inp option{background:var(--head);color:#fff}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  .ov{position:fixed;inset:0;z-index:200;background:rgba(4,2,9,.75);backdrop-filter:blur(6px);
    display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px 14px;overflow-y:auto}
  .sheet{width:100%;max-width:620px;background:var(--card);border:1px solid var(--line);border-radius:18px;
    box-shadow:0 40px 90px -30px #000;animation:rise .2s ease}
  .sheet.wide{max-width:900px}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .sh-h{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .sh-h h3{font-family:var(--disp);font-size:1.3rem;letter-spacing:.02em;flex:1}
  .sh-x{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);color:var(--tx-m);font-size:1.1rem;display:grid;place-items:center}
  .sh-x:hover{border-color:var(--pur);color:#fff}
  .sh-b{padding:18px}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:700;padding:4px 9px;border-radius:7px;
    background:rgba(255,255,255,.05);border:1px solid var(--line-s);color:var(--tx-s)}
  .chip b{color:var(--gold-br)}
  .tag{font-size:.64rem;font-weight:800;padding:3px 9px;border-radius:999px;background:rgba(227,174,51,.10);
    border:1px solid rgba(227,174,51,.28);color:var(--gold-br)}
  .pick{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:rgba(255,255,255,.03);
    color:#fff;font-weight:900;font-size:.72rem;display:grid;place-items:center;transition:.12s}
  .pick:hover{border-color:var(--pur)}
  .pick.on{background:linear-gradient(135deg,var(--pur),var(--pur-dp));border-color:transparent}
  .pickall{color:var(--tx-m);font-size:.95rem;padding:0 4px}
  .pickall:hover{color:#fff}
  .bulkbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 2px 13px;padding:10px 14px;
    border-radius:12px;background:var(--pur-soft);border:1px solid rgba(166,107,242,.4)}
  .bulkbar b{color:var(--pur-br);font-size:.86rem}
  .thumb{position:relative;width:78px;height:46px;border-radius:8px;overflow:hidden;flex-shrink:0;
    border:1px solid var(--line);background:#000;display:block;padding:0;cursor:pointer;transition:.14s}
  .thumb:hover{border-color:var(--pur);transform:scale(1.04)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb-play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:.9rem;
    text-shadow:0 2px 6px #000;background:rgba(0,0,0,.18)}
  .thumb.noimg{display:grid;place-items:center;color:var(--tx-d);font-size:1rem;background:var(--card2)}
  .thumb.noimg.empty{cursor:default;border-style:dashed}
  .pv{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
  .pv iframe,.pv video{position:absolute;inset:0;width:100%;height:100%;border:0}
  .chkbox{width:26px;height:26px;flex-shrink:0;border-radius:8px;border:2px solid var(--line);
    background:rgba(255,255,255,.03);color:#fff;font-weight:900;font-size:.95rem;display:grid;place-items:center;transition:.14s}
  .chkbox:hover{border-color:var(--pur)}
  .chkbox.on{background:linear-gradient(135deg,#2f9e6a,#1f7d51);border-color:transparent}
  .empty{text-align:center;padding:54px 20px;color:var(--tx-m)}
  .empty .ico{font-size:2.3rem;margin-bottom:10px}
  .flag{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:150;background:#0d2a1c;
    border:1px solid #1f6b45;color:#7ff0b4;font-weight:800;font-size:.8rem;padding:9px 18px;border-radius:999px;
    opacity:0;transition:.25s;pointer-events:none}
  .flag.show{opacity:1}
  .ribbon{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(227,174,51,.12);
    border-top:1px solid rgba(227,174,51,.3);color:var(--gold-br);text-align:center;font-size:.72rem;
    font-weight:700;padding:6px}
  .note{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:var(--card);margin-bottom:10px}
  .note-h{font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--pur-br);margin-bottom:5px}
  .spark{display:flex;align-items:flex-end;gap:3px;height:38px}
  .spark i{flex:1;background:linear-gradient(180deg,var(--pur-br),var(--pur-dp));border-radius:2px 2px 0 0;min-height:2px}
  @media(max-width:640px){.g3{grid-template-columns:1fr 1fr}.mark-txt span{display:none}}
</style>
</head>
<body>
<div id="app"><div class="empty">Loading…</div></div>
<div id="modal"></div>
<div id="flag" class="flag">✓ Saved</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';
const SB_URL='https://vlcpgwxeybpzwidjackz.supabase.co';
const SB_KEY='sb_publishable_gtHRqI4H2q9VwyE7sG0BKA_qJSXkJMU';
const sb=createClient(SB_URL,SB_KEY);
const uuid=()=>'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16)});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const GRADES=[3,4,5,6,7,8,9,10];

let DEMO=false, MSG_OK=true, CODES_OK=true, GOALS_OK=true, LISTS_OK=true;
const S={players:[],drills:[],coachScores:[],coaches:[],
  attrs:[],tests:[],weights:[],norms:[],results:[],snaps:[],
  groups:[],members:[],assigns:[],itemState:[],games:[],stats:[],settings:{},
  view:'cards',grades:[],adminTab:'players',testSession:null,openPlayer:null,openGame:null,assignFilter:'',
  comments:[],replies:[],access:[],msgScope:'all',msgScopeVal:'',
  objectives:[],tasks:[],lists:[],listItems:[],goalPlayer:null,assignSub:'videos',openList:null,
  videos:[],docs:[],docEdit:null,assignTags:[],picked:[]};

/* ================= data ================= */
async function loadAll(){
  const q=(t,sel='*')=>sb.from(t).select(sel);
  try{
    const r=await Promise.all([
      q('tryout_players'),q('tryout_drills'),q('tryout_scores'),q('tryout_coaches'),
      q('pd_attributes'),q('pd_tests'),q('pd_test_weights'),q('pd_norms'),q('pd_results'),
      q('pd_snapshots'),q('pd_groups'),q('pd_group_members'),q('pd_assignments'),
      q('pd_item_state'),q('pd_games'),q('pd_stats'),q('pd_settings')]);
    const bad=r.find(x=>x.error); if(bad) throw bad.error;
    [S.players,S.drills,S.coachScores,S.coaches,S.attrs,S.tests,S.weights,S.norms,S.results,
     S.snaps,S.groups,S.members,S.assigns,S.itemState,S.games,S.stats]=r.slice(0,16).map(x=>x.data||[]);
    const set={}; (r[16].data||[]).forEach(x=>set[x.key]=x.value); S.settings=set;
    // optional tables — a missing one must never knock the whole app into demo mode
    const opt=await Promise.all([q('pd_comments'),q('pd_replies'),q('pd_access'),
      q('pd_objectives'),q('pd_tasks'),q('pd_lists'),q('pd_list_items'),
      sb.from('training_videos').select('*').neq('category','fullgame'),
      sb.from('training_documents').select('*')]);
    S.comments=opt[0].data||[]; S.replies=opt[1].data||[]; S.access=opt[2].data||[];
    S.objectives=opt[3].data||[]; S.tasks=opt[4].data||[]; S.lists=opt[5].data||[]; S.listItems=opt[6].data||[];
    S.videos=opt[7].data||[]; S.docs=opt[8].data||[];
    MSG_OK=!opt[0].error && !opt[1].error; CODES_OK=!opt[2].error;
    GOALS_OK=!opt[3].error && !opt[4].error; LISTS_OK=!opt[5].error && !opt[6].error;
    if(!MSG_OK||!CODES_OK) console.warn('Messages/Parent-code tables not created yet — run the pd_access/pd_comments/pd_replies schema.');
    if(!S.attrs.length) throw new Error('not seeded');
    DEMO=false;
  }catch(e){ console.warn('Player-development tables not ready — DEMO mode.',e?.message||e); DEMO=true; seedDemo(); }
}
function seedDemo(){
  S.attrs=[['shooting','Shooting',1.2,.30],['finishing','Finishing',1.0,.45],['handle','Ball Handling',1.1,.40],
    ['passing','Passing',1.0,.60],['defense','Defense',1.1,.65],['rebound','Rebounding',.9,.50],
    ['athletic','Athleticism',1.0,0],['iq','Basketball IQ',1.2,1],['coach','Coachability',.8,1]]
    .map(([key,label,weight,cw],i)=>({id:uuid(),key,label,weight,coach_weight:cw,sort_idx:i,is_active:true}));
  S.tests=[['height','Height','in',0],['vertical','Max Vertical','in',0],['sprint','3/4 Court Sprint','sec',1],
    ['agility','Lane Agility','sec',1],['spot_shooting','Spot Shooting (of 25)','count',0],
    ['free_throws','Free Throws (of 10)','count',0],['layups','60s Layups','count',0],
    ['cone_dribble','Cone Dribble Course','sec',1],['two_ball','30s Two-Ball (errors)','count',1],
    ['passing_acc','30s Passing Accuracy','count',0]]
    .map(([key,label,unit,lb],i)=>({id:uuid(),key,label,unit,lower_is_better:!!lb,sort_idx:i,is_active:true}));
  S.weights=[['spot_shooting','shooting',.45],['free_throws','shooting',.25],['layups','finishing',.55],
    ['cone_dribble','handle',.35],['two_ball','handle',.25],['passing_acc','passing',.40],
    ['agility','defense',.35],['vertical','rebound',.30],['height','rebound',.20],
    ['sprint','athletic',.40],['vertical','athletic',.30],['agility','athletic',.30]]
    .map(([test_key,attribute_key,weight])=>({id:uuid(),test_key,attribute_key,weight}));
  const names=[['Marcus Bell',7,3],['Jayden Francis',5,12],['Cairo Rios',6,7],['Dominick Santo',8,23],
    ['Reed Heuglin',7,8],['Brantley Wozney',5,5],['Nathan Scars',8,21],['Jacob Skocik',6,14]];
  S.players=names.map(([name,grade,number])=>({id:uuid(),name,grade,number,status:'registered'}));
  S.results=[];
  const base={height:[52,66],vertical:[10,22],sprint:[3.9,5.4],agility:[10.5,14],spot_shooting:[6,20],
    free_throws:[2,9],layups:[12,30],cone_dribble:[12,20],two_ball:[0,9],passing_acc:[10,26]};
  S.players.forEach((p,pi)=>S.tests.forEach((t,ti)=>{
    const [lo,hi]=base[t.key]; const f=((pi*7+ti*13)%10)/10;
    const v=lo+(hi-lo)*f; S.results.push({id:uuid(),player_id:p.id,test_key:t.key,
      value:Math.round(v*10)/10,tested_at:'2026-08-01'});
  }));
  S.coaches=[{id:uuid(),name:'Coach Dale'}];
  S.coachScores=[]; S.players.forEach((p,pi)=>S.attrs.forEach((a,ai)=>{
    S.coachScores.push({id:uuid(),player_id:p.id,coach_id:S.coaches[0].id,category:a.key,value:4+((pi*3+ai)%6)});}));
  S.drills=[{id:uuid(),name:'Form Shooting',description:'Close-range one-hand form.',tags:['shooting'],kind:'drill',video_url:''},
    {id:uuid(),name:'Cone Dribble Series',description:'Weave both hands.',tags:['handle'],kind:'drill',video_url:''},
    {id:uuid(),name:'Closeout Breakdown',description:'Film breakdown of closeouts.',tags:['defense'],kind:'breakdown',video_url:''}];

/* ================= rating engine ================= */
const SC=()=>Object.assign({mid:70,spread:10,floor:35,cap:99,k:10},S.settings.scale||{});
const activeAttrs=()=>S.attrs.filter(a=>a.is_active!==false).sort((a,b)=>(a.sort_idx??0)-(b.sort_idx??0));
const activeTests=()=>S.tests.filter(t=>t.is_active!==false).sort((a,b)=>(a.sort_idx??0)-(b.sort_idx??0));
const visPlayers=()=>S.players.filter(p=>!S.grades.length||S.grades.includes(p.grade));

function latestResult(pid,tk){
  const rs=S.results.filter(r=>r.player_id===pid&&r.test_key===tk)
    .sort((a,b)=>String(b.tested_at).localeCompare(String(a.tested_at)));
  return rs.length?rs[0]:null;
}
function priorResult(pid,tk){
  const rs=S.results.filter(r=>r.player_id===pid&&r.test_key===tk)
    .sort((a,b)=>String(b.tested_at).localeCompare(String(a.tested_at)));
  return rs.length>1?rs[1]:null;
}
function cohort(tk,grade){
  const vals=S.players.filter(p=>p.grade===grade).map(p=>latestResult(p.id,tk)).filter(Boolean).map(r=>+r.value);
  if(!vals.length) return {n:0,mean:0,sd:0};
  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  const sd=vals.length>1?Math.sqrt(vals.reduce((s,v)=>s+(v-mean)**2,0)/(vals.length-1)):0;
  return {n:vals.length,mean,sd};
}
/* whole-program spread for a test (fallback when a grade cohort is too small to be meaningful) */
function poolStats(tk){
  const vals=S.players.map(p=>latestResult(p.id,tk)).filter(Boolean).map(r=>+r.value);
  if(!vals.length)return {n:0,mean:0,sd:0};
  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  const sd=vals.length>1?Math.sqrt(vals.reduce((s,v)=>s+(v-mean)**2,0)/(vals.length-1)):0;
  return {n:vals.length,mean,sd};
}
/* raw test value -> 0..99.
   Grade cohort is the target, but with <4 tested it's statistically meaningless
   (with n=2 every z is +/-0.707 regardless of the actual score), so we shrink it
   toward a baseline: an admin-entered norm if one exists, else the whole-program spread. */
function testRating(tk,grade,value){
  const t=S.tests.find(x=>x.key===tk); if(!t||value==null||isNaN(value))return null;
  const sc=SC(), flip=t.lower_is_better?-1:1;
  const c=cohort(tk,grade), pool=poolStats(tk);
  const nm=S.norms.find(n=>n.test_key===tk&&+n.grade===+grade);
  let zBase=0;
  if(nm&&+nm.sd>0) zBase=((value-+nm.mean)/+nm.sd)*flip;
  else if(pool.n>2&&pool.sd>0) zBase=((value-pool.mean)/pool.sd)*flip;
  const zGrade=(c.n>3&&c.sd>0)?((value-c.mean)/c.sd)*flip:null;
  const k=+sc.k||10, n=c.n;
  const z = zGrade==null ? zBase : zGrade*(n/(n+k))+zBase*(k/(n+k));
  return Math.max(sc.floor,Math.min(sc.cap,Math.round(sc.mid+sc.spread*z)));
}
/* what a rating is currently being measured against — shown in the player breakdown */
function basisFor(tk,grade){
  const c=cohort(tk,grade), pool=poolStats(tk);
  const nm=S.norms.find(n=>n.test_key===tk&&+n.grade===+grade);
  if(c.n>3) return 'grade '+grade+' ('+c.n+' tested)';
  if(nm) return 'grade '+grade+' norm';
  if(pool.n>2) return 'whole program ('+pool.n+' tested)';
  return 'not enough data';
}
const coachTo100=s=>Math.round(40+(s-1)*(60/9));
function coachAvg(pid,attrKey){
  const v=S.coachScores.filter(s=>s.player_id===pid&&s.category===attrKey).map(s=>+s.value);
  return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;
}
/* attribute = weighted blend of its tests + the coach's eye */
function attrRating(pid,attrKey){
  const p=S.players.find(x=>x.id===pid); if(!p)return {rating:null,inputs:0};
  const a=S.attrs.find(x=>x.key===attrKey); if(!a)return {rating:null,inputs:0};
  let num=0,den=0,inputs=0,parts=[];
  S.weights.filter(w=>w.attribute_key===attrKey).forEach(w=>{
    const r=latestResult(pid,w.test_key); if(!r)return;
    const rt=testRating(w.test_key,p.grade,+r.value); if(rt==null)return;
    num+=rt*+w.weight; den+=+w.weight; inputs++;
    parts.push({kind:'test',key:w.test_key,rating:rt,weight:+w.weight,raw:+r.value});
  });
  const cw=+a.coach_weight||0;
  if(cw>0){ const cs=coachAvg(pid,attrKey);
    if(cs!=null){ const rt=coachTo100(cs); num+=rt*cw; den+=cw; inputs++;
      parts.push({kind:'coach',rating:rt,weight:cw,raw:Math.round(cs*10)/10}); } }
  return den>0?{rating:Math.round(num/den),inputs,parts}:{rating:null,inputs:0,parts};
}
function playerRatings(pid){
  const out={}; activeAttrs().forEach(a=>out[a.key]=attrRating(pid,a.key)); return out;
}
function ovrOf(pid){
  const r=playerRatings(pid); let num=0,den=0,have=0;
  activeAttrs().forEach(a=>{ const x=r[a.key]; if(x.rating==null)return;
    num+=x.rating*(+a.weight||1); den+=(+a.weight||1); have++; });
  const total=activeAttrs().length;
  return {ovr:den>0?Math.round(num/den):null,coverage:total?have/total:0,ratings:r};
}
function lastSnap(pid){
  const s=S.snaps.filter(x=>x.player_id===pid).sort((a,b)=>String(b.as_of).localeCompare(String(a.as_of)));
  return s.length?s[0]:null;
}
function deltaFor(pid,key,cur){
  const s=lastSnap(pid); if(!s||cur==null)return null;
  const prev=key==='ovr'?s.ovr:(s.attributes_json||{})[key];
  if(prev==null)return null; const d=Math.round(cur-prev); return d;
}
function ratingColor(v){
  if(v==null)return 'rgba(255,255,255,.2)';
  if(v>=90)return '#F4C84B'; if(v>=80)return '#A66BF2';
  if(v>=70)return '#5ee6a0'; if(v>=60)return '#e3c33a'; return '#ff8f6b';
}
const dEl=d=>d==null?'':`<span class="delta ${d>0?'up':d<0?'down':'flat'}">${d>0?'▲'+d:d<0?'▼'+Math.abs(d):'–'}</span>`;

/* ---- Reports ---- */
function vReports(){
  const ps=visPlayers().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  return `<div class="sec"><h2>PROGRESS REPORTS</h2><div class="rule"></div></div>
    <p class="lead">Growth since the last checkpoint — ratings, raw test improvement, and what to work on next.</p>
    ${gradeBar()}
    ${ps.length?ps.map(p=>reportCard(p)).join(''):`<div class="empty"><div class="ico">📈</div><div>No players.</div></div>`}`;
}
function reportCard(p){
  const {ovr,ratings}=ovrOf(p.id);
  const snap=lastSnap(p.id);
  const gains=[];
  activeTests().forEach(t=>{const cur=latestResult(p.id,t.key),pr=priorResult(p.id,t.key);
    if(cur&&pr){const d=+cur.value-+pr.value;const better=t.lower_is_better?d<0:d>0;
      if(d!==0)gains.push({t,from:+pr.value,to:+cur.value,better});}});
  const prio=weakest(p.id,ratings);
  return `<div class="note">
    <div class="row" style="justify-content:space-between">
      <div><b style="font-size:1.05rem">${esc(p.name)}</b>
        <span class="chip" style="margin-left:6px">Grade ${p.grade??'–'}</span></div>
      <div style="text-align:right;line-height:1"><b style="font-family:var(--disp);font-size:1.7rem;color:${ratingColor(ovr)}">${ovr??'–'}</b>
        <span style="font-size:.6rem;letter-spacing:.15em;color:var(--tx-d)">OVR${dEl(deltaFor(p.id,'ovr',ovr))}</span></div>
    </div>
    ${gains.length?`<div style="margin-top:10px"><div class="note-h">Raw improvement</div>
      ${gains.map(g=>`<span class="chip" style="margin:2px 4px 2px 0">${esc(g.t.label)} <b style="color:${g.better?'#5ee6a0':'#ff8f6b'}">${g.from} → ${g.to}</b></span>`).join('')}</div>`
      :`<div style="margin-top:8px;color:var(--tx-d);font-size:.84rem">Only one test on file — re-test to show growth.</div>`}
    ${prio?`<div style="margin-top:11px"><div class="note-h">Development priority</div>
      <div style="color:var(--tx-s)"><b style="color:var(--pur-br)">${esc(prio.label)}</b> — ${prio.rating} vs their ${prio.avg} average.
      ${prio.drills.length?`Suggested: ${prio.drills.map(d=>`<span class="tag">${esc(d.name)}</span>`).join(' ')}`:`<span style="color:var(--tx-d)">Tag drills with "${esc(prio.key)}" to get suggestions.</span>`}</div></div>`:''}
    ${!snap?`<div style="margin-top:9px;color:var(--tx-d);font-size:.8rem">No checkpoint saved yet — save one on Player Cards to start tracking deltas.</div>`:''}
  </div>`;
}
/* biggest gap vs the player's own average -> the thing to coach next */
function weakest(pid,ratings){
  const vals=activeAttrs().map(a=>({a,r:ratings[a.key]?.rating})).filter(x=>x.r!=null);
  if(vals.length<3)return null;
  const avg=Math.round(vals.reduce((s,x)=>s+x.r,0)/vals.length);
  const low=vals.slice().sort((x,y)=>x.r-y.r)[0];
  const drills=S.drills.filter(d=>(d.tags||[]).some(t=>t.toLowerCase()===low.a.key.toLowerCase()
    ||t.toLowerCase()===low.a.label.toLowerCase())).slice(0,3);
  return {key:low.a.key,label:low.a.label,rating:low.r,avg,drills};
}

/* ---- Messages (coach -> parents) ---- */
function audienceLabel(c){
  if(c.scope==='all')return 'Everyone';
  if(c.scope==='grade')return 'Grade '+c.scope_value;
  if(c.scope==='group'){const g=S.groups.find(x=>x.id===c.scope_value);return g?g.name:'Group';}
  const pl=S.players.find(x=>x.id===c.scope_value);return pl?pl.name:'Player';
}
function commentReaches(c,player){
  if(c.scope==='all')return true;
  if(c.scope==='grade')return +c.scope_value===+player.grade;
  if(c.scope==='group')return S.members.some(m=>m.group_id===c.scope_value&&m.player_id===player.id);
  return c.scope_value===player.id;
}
function reachCount(c){return S.players.filter(pl=>commentReaches(c,pl)).length;}

function bulkPlayerModal(){
  modal('Bulk add players',
    '<p class="lead" style="margin-top:0">One player per line: <b>Name, Grade, Jersey#</b> — grade and number optional.</p>'+
    '<div class="field"><textarea class="inp" id="bp" rows="9" placeholder="Marcus Bell, 7, 3"></textarea></div>'+
    '<button class="btn btn-p btn-block" id="bp-save">Add players</button>');
  $('bp-save').onclick=async()=>{
    const lines=$('bp').value.split(String.fromCharCode(10)).map(l=>l.trim()).filter(Boolean);
    let n=0;
    for(const l of lines){
      const parts=l.split(',').map(x=>(x||'').trim());
      const name=parts[0], g=parts[1], num=parts[2];
      if(!name)continue;
      const row={name,grade:g?+g:null,number:num?+num:null,status:'registered'};
      const sv=await put('tryout_players',row); S.players.push(sv||Object.assign({id:uuid()},row)); n++;}
    closeModal(); render(); flag(n+' players added');};
}

/* ---- Admin: parent access codes ---- */
function randCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let o='';for(let i=0;i<4;i++)o+=A[Math.floor(Math.random()*A.length)];return 'JAG-'+o;}
/* A stable code derived from the player id, so parent codes work even before
   the pd_access table exists. An explicitly issued pd_access row always wins. */
function derivedCode(pid){
  const s=String(pid||''); let h=2166136261;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let n=Math.abs(h),o='';
  for(let i=0;i<4;i++){o+=A[n%A.length];n=Math.floor(n/A.length);}
  return 'JAG-'+o;
}
function codeFor(pid){const ac=S.access.find(x=>x.player_id===pid&&!x.revoked_at);return ac?ac.code:derivedCode(pid);}
function adminAccess(){
  const ps=S.players.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const head = (CODES_OK?'<div class="row" style="margin-bottom:12px"><button class="btn btn-p btn-s" data-act="codes-all">⚡ Regenerate all codes</button></div>':'')
    + '<p class="lead">Give a family their code and they open <b>j3hoops.com/parent</b> to see their athlete.'
    + (CODES_OK?'':' <b style="color:var(--gold-br)">These codes work right now</b> — each one is generated from the player, so it stays the same. Create the pd_access table if you want to be able to change them.')
    + '</p>';
  return head+
    (ps.length?'<div class="wrap"><div class="scroll"><table>'+
    '<thead><tr><th class="l">Player</th><th>Grade</th><th>Parent code</th><th></th></tr></thead><tbody>'+
    ps.map(pl=>{const ac=S.access.find(a=>a.player_id===pl.id&&!a.revoked_at);
      return '<tr><td><div class="cell l"><b>'+esc(pl.name)+'</b></div></td>'+
        '<td><div class="cell">'+(pl.grade==null?'–':pl.grade)+'</div></td>'+
        '<td><div class="cell" style="font-family:monospace;font-size:1.05rem;color:var(--gold-br)">'+esc(codeFor(pl.id))+'</div></td>'+
        '<td><div class="cell">'+(CODES_OK?'<button class="btn btn-g btn-s" data-code="'+pl.id+'">'+(ac?'Regenerate':'Generate')+'</button>':'<span style="color:var(--tx-d);font-size:.78rem">auto</span>')+'</div></td></tr>';}).join('')+
    '</tbody></table></div></div>':'<div class="empty"><div class="ico">🔑</div><div>Add players first.</div></div>');
}
async function makeCode(pid){
  const old=S.access.filter(a=>a.player_id===pid&&!a.revoked_at);
  for(const o of old){await del('pd_access',o.id); S.access=S.access.filter(x=>x.id!==o.id);}
  const row={player_id:pid,code:randCode()};
  const sv=await put('pd_access',row); S.access.push(sv||Object.assign({id:uuid()},row));
}

function vidUrl(v){return v.youtube_id?('https://www.youtube.com/watch?v='+v.youtube_id):null;}
function ytId(u){const m=String(u||'').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);return m?m[1]:null;}
function asMedia(x,kind){
  if(kind==='video'){
    const yt=x.youtube_id||null;
    return {mid:'v:'+x.id, vid:x.id, did:null, name:x.title, desc:x.summary, url:vidUrl(x),
      tags:x.tags||[], cat:x.category, yt,
      thumb:x.custom_thumb||(yt?'https://img.youtube.com/vi/'+yt+'/mqdefault.jpg':null)};
  }

  return {mid:'d:'+x.id, vid:null, did:x.id, name:x.name, desc:x.description, url:x.video_url,
    tags:x.tags||[], cat:x.kind||'drill', yt,
    thumb:yt?'https://img.youtube.com/vi/'+yt+'/mqdefault.jpg':null};

/* tag index across the whole library, case-insensitive with a canonical label */
function tagIndex(){
  const m=new Map();
  allMedia().forEach(x=>(x.tags||[]).forEach(t=>{
    const k=String(t).trim().toLowerCase(); if(!k)return;
    const e=m.get(k)||{label:String(t).trim(),n:0}; e.n++; m.set(k,e);}));
  return [...m.entries()].map(([k,v])=>({key:k,label:v.label,n:v.n}))
    .sort((a,b)=>b.n-a.n||a.label.localeCompare(b.label));
}
const hasTag=(m,k)=>(m.tags||[]).some(t=>String(t).trim().toLowerCase()===k);
async function addTagsTo(mids,tags){
  for(const mid of mids){
    const [k,id]=mid.split(':');
    const raw=k==='v'?S.videos.find(x=>x.id===id):S.drills.find(x=>x.id===id);
    if(!raw)continue;
    const cur=raw.tags||[];
    const merged=cur.slice();
    tags.forEach(t=>{ if(!cur.some(c=>String(c).trim().toLowerCase()===t.toLowerCase())) merged.push(t); });
    raw.tags=merged;
    await patch(k==='v'?'training_videos':'tryout_drills',id,{tags:merged});
  }
}

function assignedFor(pid){
  const p=S.players.find(x=>x.id===pid); if(!p)return [];
  const gids=S.members.filter(m=>m.player_id===pid).map(m=>m.group_id);
  const mine=S.assigns.filter(a=>a.scope==='all'
    ||(a.scope==='grade'&&+a.scope_value===+p.grade)
    ||(a.scope==='group'&&gids.includes(a.scope_value))
    ||(a.scope==='player'&&a.scope_value===pid));
  const ids=new Set();
  const mids=new Set();
  mine.forEach(a=>{ if(a.drill_id) mids.add('d:'+a.drill_id);
    if(a.video_id) mids.add('v:'+a.video_id);
    if(a.list_id) listDrills(a.list_id).forEach(m=>mids.add(m.mid)); });
  return allMedia().filter(m=>mids.has(m.mid));
}

  const tgt=()=>{const v=$('as-scope').value;
    $('as-target').innerHTML = v==='player'
      ? `<div class="field"><label>Players (tap to toggle)</label><div id="as-players" class="row">
          ${S.players.sort((a,b)=>(a.number??999)-(b.number??999)).map(p=>`<button class="gchip" data-pick="${p.id}">${p.number??'–'} ${esc(p.name.split(' ')[0])}</button>`).join('')}</div></div>`
      : v==='group'
      ? `<div class="field"><label>Group</label><select class="inp" id="as-val">${S.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div>`
      : v==='grade'
      ? `<div class="field"><label>Grade</label><select class="inp" id="as-val">${GRADES.map(g=>`<option value="${g}">Grade ${g}</option>`).join('')}</select></div>`
      : `<p class="lead">Assigned to every player in the program.</p>`;
    document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
  };
  $('as-scope').onchange=tgt; tgt();
  document.querySelectorAll('[data-unassign]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.unassign; S.assigns=S.assigns.filter(a=>a.id!==id); await del('pd_assignments',id); closeModal(); render(); flag('Removed');});
  $('as-save').onclick=async()=>{
    const scope=$('as-scope').value;
    const reps=parseInt($('as-reps').value)||null, due=$('as-due').value||null;
    const mk=async v=>{const row=isList?{list_id:listId,scope,scope_value:v,reps_target:reps,due_date:due}
      :Object.assign({scope,scope_value:v,reps_target:reps,due_date:due}, kind==='v'?{video_id:rid}:{drill_id:rid});
      const saved=await put('pd_assignments',row); S.assigns.push(saved||{id:uuid(),...row});};
    if(scope==='player'){const picks=[...document.querySelectorAll('[data-pick].on')].map(b=>b.dataset.pick);
      if(!picks.length)return; for(const p of picks) await mk(p);}
    else if(scope==='all') await mk(null);
    else await mk($('as-val').value);
    closeModal(); render(); flag('Assigned');
  };
}

const BOX=['min','pts','fgm','fga','tpm','tpa','ftm','fta','oreb','dreb','ast','stl','blk','tov','pf','pm'];
function boxModal(gid){
  const g=S.games.find(x=>x.id===gid); if(!g)return;
  modal('Box score · '+esc(g.opponent||'Game'),`
    <div class="wrap"><div class="scroll"><table>
      <thead><tr><th class="l">Player</th>${BOX.map(k=>`<th>${k.toUpperCase()}</th>`).join('')}</tr></thead>
      <tbody>${S.players.sort((a,b)=>(a.number??999)-(b.number??999)).map(p=>{
        const st=S.stats.find(s=>s.game_id===gid&&s.player_id===p.id)||{};
        return `<tr><td><div class="cell l"><b>${esc(p.name)}</b></div></td>
          ${BOX.map(k=>`<td><input class="nin" style="width:52px" inputmode="numeric" value="${st[k]??''}" data-box="${p.id}" data-k="${k}" data-g="${gid}"></td>`).join('')}
        </tr>`}).join('')}</tbody></table></div></div>
    <p class="lead" style="margin-top:10px">Saves as you type.</p>`,true);
  document.querySelectorAll('[data-box]').forEach(inp=>inp.onchange=async()=>{
    const pid=inp.dataset.box,k=inp.dataset.k,v=inp.value===''?null:+inp.value;
    let st=S.stats.find(s=>s.game_id===gid&&s.player_id===pid);
    if(!st){st={id:uuid(),game_id:gid,player_id:pid};S.stats.push(st);}
    st[k]=v;
    const row={game_id:gid,player_id:pid}; BOX.forEach(kk=>{ if(st[kk]!=null) row[kk]=st[kk]; });
    const saved=await put('pd_stats',row,'game_id,player_id'); if(saved)st.id=saved.id;
    flag('Saved');});
}

/* ================= wire ================= */
function wire(){
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render();});
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
    const g=b.dataset.g;
    if(g==='all')S.grades=[]; else{const n=+g,i=S.grades.indexOf(n);i>=0?S.grades.splice(i,1):S.grades.push(n);}
    render();});
  document.querySelectorAll('[data-p]').forEach(el=>el.onclick=()=>playerModal(el.dataset.p));
  document.querySelectorAll('[data-atab]').forEach(b=>b.onclick=()=>{S.adminTab=b.dataset.atab;render();});
  document.querySelectorAll('[data-assignmid]').forEach(b=>b.onclick=()=>assignModal(b.dataset.assignmid));
  document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=e=>{e.stopPropagation();previewModal(b.dataset.preview);});
  document.querySelectorAll('[data-atag]').forEach(b=>b.onclick=e=>{e.stopPropagation();
    const k=b.dataset.atag;
    if(k==='__clear'){S.assignTags=[];}
    else{const i=S.assignTags.indexOf(k); i>=0?S.assignTags.splice(i,1):S.assignTags.push(k);}
    render();});
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=e=>{e.stopPropagation();
    const m=b.dataset.pick; const i=S.picked.indexOf(m); i>=0?S.picked.splice(i,1):S.picked.push(m); render();});
  const pa=document.querySelector('[data-pickall]'); if(pa)pa.onclick=()=>{
    const vis=[...document.querySelectorAll('[data-pick]')].map(b=>b.dataset.pick);
    const allOn=vis.length&&vis.every(m=>S.picked.includes(m));
    if(allOn) S.picked=S.picked.filter(m=>!vis.includes(m));
    else vis.forEach(m=>{if(!S.picked.includes(m))S.picked.push(m);});
    render();};
  document.querySelectorAll('[data-acat]').forEach(b=>b.onclick=()=>{S.assignCat=b.dataset.acat;render();});
  document.querySelectorAll('[data-edoc]').forEach(b=>b.onclick=()=>docModal(b.dataset.edoc));
  document.querySelectorAll('[data-eattr]').forEach(b=>b.onclick=()=>attrModal(b.dataset.eattr));
  document.querySelectorAll('[data-etest]').forEach(b=>b.onclick=()=>testModal(b.dataset.etest));
  document.querySelectorAll('[data-egroup]').forEach(b=>b.onclick=()=>groupModal(b.dataset.egroup));
  document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>gameModal(b.dataset.game));
  document.querySelectorAll('[data-dweight]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.dweight; S.weights=S.weights.filter(w=>w.id!==id); await del('pd_test_weights',id); render(); flag('Removed');});
  document.querySelectorAll('[data-wid]').forEach(inp=>inp.onchange=async()=>{
    const w=S.weights.find(x=>x.id===inp.dataset.wid); if(!w)return;
    w.weight=+inp.value||0; await patch('pd_test_weights',w.id,{weight:w.weight}); render(); flag('Updated');});
  // test result entry
  document.querySelectorAll('[data-res]').forEach(inp=>inp.onchange=async()=>{
    const pid=inp.dataset.res,tk=inp.dataset.tk,raw=inp.value.trim();
    const ex=latestResult(pid,tk);
    if(raw===''){ if(ex){S.results=S.results.filter(r=>r.id!==ex.id); await del('pd_results',ex.id);} render(); flag('Cleared'); return; }
    const value=parseFloat(raw); if(isNaN(value))return;
    const today=new Date().toISOString().slice(0,10);
    if(ex&&ex.tested_at===today){ ex.value=value; await patch('pd_results',ex.id,{value}); }
    else{ const row={player_id:pid,test_key:tk,value,tested_at:today};
      const s=await put('pd_results',row); S.results.push(s||{id:uuid(),...row}); }
    render(); flag('Saved');});
  const af=$('afilter'); if(af)af.oninput=()=>{S.assignFilter=af.value;render();
    const e=$('afilter'); if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length);}};
  document.querySelectorAll('[data-eplayer]').forEach(b=>b.onclick=()=>playerEditModal(b.dataset.eplayer));
  document.querySelectorAll('[data-code]').forEach(b=>b.onclick=async()=>{await makeCode(b.dataset.code);render();flag('Code created');});
  document.querySelectorAll('[data-dmsg]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.dmsg; S.comments=S.comments.filter(c=>c.id!==id); await del('pd_comments',id); render(); flag('Deleted');});
  const gs=document.getElementById('goalsel'); if(gs)gs.onchange=()=>{S.goalPlayer=gs.value;render();};
  document.querySelectorAll('[data-asub]').forEach(b=>b.onclick=()=>{S.assignSub=b.dataset.asub;S.openList=null;render();});
  document.querySelectorAll('[data-openlist]').forEach(b=>b.onclick=()=>{S.openList=b.dataset.openlist;render();});
  document.querySelectorAll('[data-assignlist]').forEach(b=>b.onclick=()=>assignModal(null,b.dataset.assignlist));
  document.querySelectorAll('[data-listadd]').forEach(b=>b.onclick=async()=>{
    const [lid,mid]=b.dataset.listadd.split('|');
    const [k,rid]=mid.split(':');
    const maxo=S.listItems.filter(i=>i.list_id===lid).reduce((m,x)=>Math.max(m,x.order_idx||0),0);
    const row=Object.assign({list_id:lid,order_idx:maxo+10}, k==='v'?{video_id:rid}:{drill_id:rid});
    const sv=await put('pd_list_items',row); S.listItems.push(sv||Object.assign({id:uuid()},row));
    render(); flag('Added to list');});
  document.querySelectorAll('[data-listrm]').forEach(b=>b.onclick=async()=>{
    const [lid,mid]=b.dataset.listrm.split('|');
    const [k,rid]=mid.split(':');
    const it=S.listItems.find(i=>i.list_id===lid&&(k==='v'?i.video_id===rid:i.drill_id===rid)); if(!it)return;
    S.listItems=S.listItems.filter(i=>i.id!==it.id); await del('pd_list_items',it.id); render(); flag('Removed');});
  document.querySelectorAll('[data-listdel]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.listdel; S.lists=S.lists.filter(l=>l.id!==id);
    S.listItems=S.listItems.filter(i=>i.list_id!==id); S.openList=null;
    await del('pd_lists',id); render(); flag('List deleted');});
  document.querySelectorAll('[data-objtog]').forEach(b=>b.onclick=async()=>{
    const o=S.objectives.find(x=>x.id===b.dataset.objtog); if(!o)return;
    o.done=!o.done; o.done_at=o.done?new Date().toISOString():null;
    await patch('pd_objectives',o.id,{done:o.done,done_at:o.done_at}); render(); flag(o.done?'Completed':'Reopened');});
  document.querySelectorAll('[data-objdel]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.objdel; S.objectives=S.objectives.filter(x=>x.id!==id); await del('pd_objectives',id); render();});
  document.querySelectorAll('[data-tasktog]').forEach(b=>b.onclick=async()=>{
    const t=S.tasks.find(x=>x.id===b.dataset.tasktog); if(!t)return;
    t.done=!taskDone(t); t.done_at=t.done?new Date().toISOString():null;
    await patch('pd_tasks',t.id,{done:t.done,done_at:t.done_at}); render();});
  document.querySelectorAll('[data-taskdel]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.taskdel; S.tasks=S.tasks.filter(x=>x.id!==id); await del('pd_tasks',id); render();});
  const acts={
    'new-attr':()=>attrModal(),'new-test':()=>testModal(),'new-weight':()=>weightModal(),
    'new-group':()=>groupModal(),'new-drill':()=>drillModal(),'new-game':()=>gameModal(),
    'snap':saveCheckpoint,'save-scale':saveScale,
    'new-msg':()=>msgModal(),'new-player':()=>playerEditModal(),'bulk-player':()=>bulkPlayerModal(),
    'bulk-tag':()=>bulkTagModal(),
    'bulk-clear':()=>{S.picked=[];render();},
    'bulk-assign':()=>{ if(S.picked.length) assignModal(S.picked[0]); },
    'new-doc':()=>docModal(),'new-obj':()=>objModal(),'new-task':()=>taskModal(),'new-list':()=>listModal(),
    'list-back':()=>{S.openList=null;render();},
    'codes-all':async()=>{for(const pl of S.players){ if(!S.access.find(a=>a.player_id===pl.id&&!a.revoked_at)) await makeCode(pl.id);} render(); flag('Codes generated');}};
  document.querySelectorAll('[data-act]').forEach(b=>{const f=acts[b.dataset.act]; if(f)b.onclick=f;});
}
async function saveCheckpoint(){
  const today=new Date().toISOString().slice(0,10);
  for(const p of S.players){
    const {ovr,ratings}=ovrOf(p.id); if(ovr==null)continue;
    const aj={}; Object.keys(ratings).forEach(k=>{if(ratings[k].rating!=null)aj[k]=ratings[k].rating;});
    const row={player_id:p.id,as_of:today,ovr,attributes_json:aj,trigger:'manual'};
    const s=await put('pd_snapshots',row); S.snaps.push(s||{id:uuid(),...row});
  }
  render(); flag('Checkpoint saved');
}
async function saveScale(){
  const v={mid:+$('sc-mid').value||70,spread:+$('sc-spread').value||10,
    floor:+$('sc-floor').value||35,cap:+$('sc-cap').value||99,k:+$('sc-k').value||10};
  S.settings.scale=v; await put('pd_settings',{key:'scale',value:v},'key');
  render(); flag('Scale saved');
}

await loadAll(); subscribe(); render();
</script>
