<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#25104A"/>
<title>Jaguars · Player Development</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --pur-900:#170733; --pur-800:#25104A; --pur-700:#3A1A6B; --pur-600:#4E2489; --pur-400:#8B5CD6;
    --bg:#170733; --card:#25104A; --card2:#3A1A6B; --head:#25104A;
    --pur:#8B5CD6; --pur-br:#A78BFA; --pur-dp:#4E2489; --pur-soft:rgba(139,92,214,.16);
    --gold:#F0A83C; --gold-br:#FFC96B; --gold-dk:#C77F1E;
    --tx:#fff; --tx-s:rgba(255,255,255,.80); --tx-m:rgba(255,255,255,.58); --tx-d:rgba(255,255,255,.34);
    --line:rgba(255,255,255,.13); --line-s:rgba(255,255,255,.07);
    --panel:rgba(255,255,255,.045); --good:#54E08A; --bad:#FF7A6B;
    --disp:'Archivo Black',system-ui,sans-serif;
    --cond:'Barlow Condensed',system-ui,sans-serif;
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --maxw:1240px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{font-family:var(--sans);color:var(--tx);line-height:1.5;min-height:100vh;overflow-x:hidden;
    background:radial-gradient(1000px 620px at 78% -8%,rgba(240,168,60,.13),transparent 62%),
               radial-gradient(900px 700px at -12% 8%,rgba(139,92,214,.24),transparent 60%),var(--bg);
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit}

  .bar{position:sticky;top:0;z-index:80;background:rgba(23,7,51,.86);backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);border-bottom:1px solid var(--line)}
  .bar-in{max-width:var(--maxw);margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:14px}
  .mark{display:flex;align-items:center;gap:11px;min-width:0}
  .mark-badge{width:42px;height:42px;flex-shrink:0;display:grid;place-items:center}
  .mark-badge img{width:100%;height:100%;object-fit:contain;display:block}
  .mark-txt b{font-family:var(--disp);font-size:1.06rem;letter-spacing:.02em;display:block;line-height:1}
  .mark-txt span{font-family:var(--cond);font-size:.82rem;font-weight:700;color:var(--gold);letter-spacing:.13em;text-transform:uppercase}
  .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);
    background:rgba(255,255,255,.03);font-size:.76rem;font-weight:700;white-space:nowrap}
  .pill .dot{width:8px;height:8px;border-radius:50%;background:#39d98a;box-shadow:0 0 8px #39d98a}

  .tabs{position:sticky;top:61px;z-index:70;background:rgba(37,16,74,.80);backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line-s)}
  .tabs-in{max-width:var(--maxw);margin:0 auto;padding:0 12px;display:flex;gap:4px;overflow-x:auto}
  .tab{font-family:var(--cond);padding:13px 15px;font-size:.94rem;font-weight:700;letter-spacing:.09em;color:var(--tx-m);
    white-space:nowrap;border-bottom:2.5px solid transparent;text-transform:uppercase;transition:.15s}
  .tab:hover{color:var(--tx-s)} .tab.on{color:var(--tx);border-bottom-color:var(--gold)}
  main{max-width:var(--maxw);margin:0 auto;padding:22px 16px 80px}

  .sec{display:flex;align-items:center;gap:12px;margin:2px 2px 16px;flex-wrap:wrap}
  .sec h2{font-family:var(--disp);font-size:1.42rem;letter-spacing:-.01em;color:#fff;
    padding-left:13px;border-left:4px solid var(--gold);line-height:1.1}
  .sec .rule{flex:1;height:1px;background:var(--line);min-width:20px;opacity:.7}
  .lead{color:var(--tx-m);margin:-8px 2px 16px;font-size:.9rem}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:10px;
    font-weight:800;font-size:.83rem;transition:.15s;white-space:nowrap}
  .btn-p{background:linear-gradient(135deg,var(--pur),var(--pur-dp));color:#fff;box-shadow:0 10px 22px -10px var(--pur)}
  .btn-p:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .btn-g{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--tx-s)}
  .btn-g:hover{border-color:var(--pur);color:var(--pur-br)}
  .btn-s{padding:7px 12px;font-size:.75rem;border-radius:8px}
  .btn-block{width:100%}
  .btn-dz{color:#ff7a7a;border-color:rgba(255,122,122,.3)}

  .gradebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 2px 16px}
  .gl{font-size:.65rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-m)}
  .gchip{min-width:34px;padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);
    color:var(--tx-m);font-size:.8rem;font-weight:800;transition:.12s}
  .gchip:hover{border-color:var(--pur);color:#fff}
  .gchip.on{background:linear-gradient(135deg,var(--pur),var(--pur-dp));border-color:transparent;color:#fff}

  /* ==== player card ==== */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
  .pcard{position:relative;border-radius:16px;overflow:hidden;cursor:pointer;transition:.16s;
    border:1px solid var(--line);background:linear-gradient(160deg,#1d1030,#100a1b)}
  .pcard:hover{transform:translateY(-3px);border-color:rgba(166,107,242,.55)}
  .pcard.t-elite{border-color:rgba(244,200,75,.5);background:linear-gradient(160deg,#2a1e12,#120c1c)}
  .pcard-top{display:flex;align-items:center;gap:12px;padding:14px 15px 10px}
  .jersey{width:52px;height:52px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;
    font-family:var(--disp);font-size:1.5rem;background:var(--card2);border:1px solid var(--line)}
  .pname{font-weight:800;font-size:1.05rem;line-height:1.15}
  .pmeta{font-size:.7rem;color:var(--tx-d);font-weight:600;margin-top:2px}
  .ovr{margin-left:auto;text-align:center;line-height:1}
  .ovr b{font-family:var(--disp);font-size:2.5rem;display:block}
  .ovr span{font-size:.58rem;font-weight:900;letter-spacing:.18em;color:var(--tx-d)}
  .bars{padding:4px 15px 14px;display:grid;gap:7px}
  .brow{display:grid;grid-template-columns:76px 1fr 34px;align-items:center;gap:9px}
  .blab{font-size:.66rem;font-weight:700;color:var(--tx-m);text-transform:uppercase;letter-spacing:.04em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btrack{height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
  .bfill{height:100%;border-radius:99px;transition:width .5s ease}
  .bval{font-family:var(--disp);font-size:.95rem;text-align:right}
  .delta{font-size:.62rem;font-weight:800;margin-left:3px}
  .up{color:#5ee6a0} .down{color:#ff8080} .flat{color:var(--tx-d)}
  .prov{position:absolute;top:12px;right:12px;font-size:.54rem;font-weight:900;letter-spacing:.1em;
    color:var(--gold-br);border:1px solid rgba(227,174,51,.45);border-radius:5px;padding:2px 6px;background:rgba(0,0,0,.35)}

  /* ==== tables / grids ==== */
  .wrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%}
  th{position:sticky;top:0;background:var(--head);font-size:.63rem;font-weight:800;letter-spacing:.07em;
    text-transform:uppercase;color:var(--tx-m);padding:11px 8px;text-align:center;white-space:nowrap;
    border-bottom:1px solid var(--line);z-index:2}
  th.l{text-align:left;padding-left:14px}
  td{padding:0;text-align:center;border-bottom:1px solid var(--line-s)}
  tbody tr:hover{background:rgba(255,255,255,.025)}
  tbody tr:last-child td{border-bottom:none}
  .cell{padding:9px 8px;font-weight:700;font-size:.9rem}
  .cell.l{text-align:left;padding-left:14px}
  .nin{width:66px;padding:7px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);
    color:#fff;font-weight:800;font-size:.88rem;text-align:center}
  .nin:focus{outline:none;border-color:var(--pur);background:var(--pur-soft)}
  .nin.filled{border-color:rgba(94,230,160,.4)}

  .field{margin-bottom:12px}
  .field label{display:block;font-size:.64rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:var(--tx-m);margin-bottom:5px}
  .inp{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);
    color:#fff;font-size:.92rem;font-weight:600}
  .inp:focus{outline:none;border-color:var(--pur);background:var(--pur-soft)}
  .inp::placeholder{color:var(--tx-d)}
  select.inp{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:34px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23A66BF2' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center}
  select.inp option{background:var(--head);color:#fff}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  .ov{position:fixed;inset:0;z-index:200;background:rgba(4,2,9,.75);backdrop-filter:blur(6px);
    display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px 14px;overflow-y:auto}
  .sheet{width:100%;max-width:620px;background:var(--card);border:1px solid var(--line);border-radius:18px;
    box-shadow:0 40px 90px -30px #000;animation:rise .2s ease}
  .sheet.wide{max-width:900px}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .sh-h{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .sh-h h3{font-family:var(--disp);font-size:1.3rem;letter-spacing:.02em;flex:1}
  .sh-x{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);color:var(--tx-m);font-size:1.1rem;display:grid;place-items:center}
  .sh-x:hover{border-color:var(--pur);color:#fff}
  .sh-b{padding:18px}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:700;padding:4px 9px;border-radius:7px;
    background:rgba(255,255,255,.05);border:1px solid var(--line-s);color:var(--tx-s)}
  .chip b{color:var(--gold-br)}
  .tag{font-size:.64rem;font-weight:800;padding:3px 9px;border-radius:999px;background:rgba(227,174,51,.10);
    border:1px solid rgba(227,174,51,.28);color:var(--gold-br)}
  .pick{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:rgba(255,255,255,.03);
    color:#fff;font-weight:900;font-size:.72rem;display:grid;place-items:center;transition:.12s}
  .pick:hover{border-color:var(--pur)}
  .pick.on{background:linear-gradient(135deg,var(--pur),var(--pur-dp));border-color:transparent}
  .pickall{color:var(--tx-m);font-size:.95rem;padding:0 4px}
  .pickall:hover{color:#fff}
  .bulkbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 2px 13px;padding:10px 14px;
    border-radius:12px;background:var(--pur-soft);border:1px solid rgba(166,107,242,.4)}
  .bulkbar b{color:var(--pur-br);font-size:.86rem}
  .thumb{position:relative;width:78px;height:46px;border-radius:8px;overflow:hidden;flex-shrink:0;
    border:1px solid var(--line);background:#000;display:block;padding:0;cursor:pointer;transition:.14s}
  .thumb:hover{border-color:var(--pur);transform:scale(1.04)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb-play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:.9rem;
    text-shadow:0 2px 6px #000;background:rgba(0,0,0,.18)}
  .thumb.noimg{display:grid;place-items:center;color:var(--tx-d);font-size:1rem;background:var(--card2)}
  .thumb.noimg.empty{cursor:default;border-style:dashed}
  .pv{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
  .pv iframe,.pv video{position:absolute;inset:0;width:100%;height:100%;border:0}
  .chkbox{width:26px;height:26px;flex-shrink:0;border-radius:8px;border:2px solid var(--line);
    background:rgba(255,255,255,.03);color:#fff;font-weight:900;font-size:.95rem;display:grid;place-items:center;transition:.14s}
  .chkbox:hover{border-color:var(--pur)}
  .chkbox.on{background:linear-gradient(135deg,#2f9e6a,#1f7d51);border-color:transparent}
  .empty{text-align:center;padding:54px 20px;color:var(--tx-m)}
  .empty .ico{font-size:2.3rem;margin-bottom:10px}
  .flag{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:150;background:#0d2a1c;
    border:1px solid #1f6b45;color:#7ff0b4;font-weight:800;font-size:.8rem;padding:9px 18px;border-radius:999px;
    opacity:0;transition:.25s;pointer-events:none}
  .flag.show{opacity:1}
  .ribbon{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(227,174,51,.12);
    border-top:1px solid rgba(227,174,51,.3);color:var(--gold-br);text-align:center;font-size:.72rem;
    font-weight:700;padding:6px}
  .note{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:var(--card);margin-bottom:10px}
  .note-h{font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--pur-br);margin-bottom:5px}
  .spark{display:flex;align-items:flex-end;gap:3px;height:38px}
  .spark i{flex:1;background:linear-gradient(180deg,var(--pur-br),var(--pur-dp));border-radius:2px 2px 0 0;min-height:2px}
  @media(max-width:640px){.g3{grid-template-columns:1fr 1fr}.mark-txt span{display:none}}

  /* ===== printable team progress report ===== */
  .printhead,.printfoot{display:none}
  @media print{
    @page{margin:12mm;size:landscape}
    html,body{background:#fff !important;color:#111 !important}
    body{font-family:Georgia,serif;font-size:10pt}
    .bar,.tabs,.ribbon,.flag,.noprint,#modal,.sec .btn,.gradebar{display:none !important}
    main{max-width:none !important;margin:0 !important;padding:0 !important}
    .printhead{display:block !important;margin:0 0 14px}
    .ph-row{display:flex;align-items:flex-end;gap:14px;border-bottom:2.5pt solid #4a2670;padding-bottom:9px}
    .ph-paw{color:#4a2670 !important;flex-shrink:0}
    .ph-kick{font-family:Helvetica,Arial,sans-serif;font-size:7.5pt;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#6b6478 !important}
    .ph-title{font-family:Helvetica,Arial,sans-serif;font-size:19pt;font-weight:800;color:#1a1030 !important;line-height:1.05}
    .ph-min{margin-left:auto;text-align:right;line-height:1}
    .ph-min b{font-family:Helvetica,Arial,sans-serif;font-size:22pt;font-weight:800;color:#4a2670 !important;display:block}
    .ph-min span{font-family:Helvetica,Arial,sans-serif;font-size:7pt;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#6b6478 !important}
    .ph-meta{font-family:Helvetica,Arial,sans-serif;font-size:8.5pt;color:#555 !important;margin-top:7px}
    .wrap{border:0.7pt solid #b9b2c6 !important;border-radius:5px;background:#fff !important}
    table{width:100%}
    th{background:#efeaf7 !important;color:#3a3348 !important;border-bottom:0.7pt solid #b9b2c6 !important;
      -webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:7.5pt}
    td{border-bottom:0.5pt solid #ddd7e6 !important}
    tbody tr{break-inside:avoid;page-break-inside:avoid}
    .cell{color:#1d1a25 !important;font-size:9.5pt}
    .btrack{background:#ddd7e6 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .bfill{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .note{background:#fff !important;border:0.7pt solid #b9b2c6 !important;break-inside:avoid;page-break-inside:avoid}
    .note-h{color:#4a2670 !important}
    .chip,.tag{background:#f4f1fa !important;border-color:#cfc6e0 !important;color:#3a3348 !important;
      -webkit-print-color-adjust:exact;print-color-adjust:exact}
    .sec h2{color:#1a1030 !important}
    .printfoot{display:flex !important;justify-content:space-between;margin-top:10px;padding-top:7px;
      border-top:0.7pt solid #b9b2c6;font-family:Helvetica,Arial,sans-serif;font-size:8pt;color:#6b6478 !important}
  }

/* ---- media library ---- */
.libhead{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.libstat{flex:1;min-width:110px;background:var(--pan);border:1px solid var(--ln);border-radius:14px;padding:12px 14px}
.libstat b{display:block;font-size:1.5rem;font-weight:900;color:#fff;line-height:1}
.libstat span{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--tx-d);font-weight:800}
.libstat.warn b{color:#ffb84d}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:14px}
.libcard{position:relative;background:var(--pan);border:1px solid var(--ln);border-radius:15px;overflow:hidden;transition:border-color .15s,transform .15s}
.libcard:hover{border-color:var(--pur-br);transform:translateY(-2px)}
.libcard.on{border-color:var(--gold,#F0A83C);box-shadow:0 0 0 1px var(--gold,#F0A83C) inset}
.libcard .pick{position:absolute;top:8px;left:8px;z-index:3}
.libthumb{position:relative;aspect-ratio:16/9;background:#120a22;display:flex;align-items:center;justify-content:center}
.libthumb img{width:100%;height:100%;object-fit:cover;display:block}
.libnone{font-size:1.5rem;color:#4a3a66}
.libplay{position:absolute;inset:0;width:100%;border:0;background:rgba(10,6,18,.35);color:#fff;font-size:1.4rem;cursor:pointer;opacity:0;transition:opacity .15s}
.libcard:hover .libplay{opacity:1}
.libbody{padding:11px 12px 12px}
.libname{font-weight:800;color:#fff;font-size:.92rem;line-height:1.3;margin-bottom:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.libmeta{margin-bottom:7px}
.chip.warriors{background:rgba(240,168,60,.14);color:#F0A83C;border-color:rgba(240,168,60,.35)}
.libtags{margin-bottom:9px;min-height:20px}
.libwarn{font-size:.72rem;color:#ffb84d;font-weight:700}
.librow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.libuse{font-size:.72rem;color:var(--tx-d);font-weight:700}
.empty{padding:34px;text-align:center;color:var(--tx-d);background:var(--pan);border:1px dashed var(--ln);border-radius:15px}
.dz{margin-top:16px;padding-top:14px;border-top:1px solid var(--ln);display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.dzn{font-size:.76rem;color:var(--tx-d);font-weight:600}
.btn-d{background:rgba(226,74,74,.12);border-color:rgba(226,74,74,.4);color:#ff8080}
.btn-d:hover{background:rgba(226,74,74,.22)}
@media(max-width:520px){.libgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}}

/* ---- season selector ---- */
.seasonsel{font-family:var(--cond);font-size:.92rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:rgba(255,255,255,.05);color:var(--gold);border:1px solid var(--line);border-radius:999px;
  padding:7px 12px;cursor:pointer;max-width:200px}
.seasonsel option{background:var(--pur-800);color:#fff}

/* ---- player photo chip ---- */
.pchip{border-radius:50%;object-fit:cover;display:block;flex-shrink:0;
  border:2px solid rgba(255,255,255,.18);background:var(--pur-700)}
.pchip.noimg{display:grid;place-items:center;font-family:var(--disp);color:var(--gold);
  background:linear-gradient(150deg,var(--pur-600),var(--pur-800));letter-spacing:.02em}
.phprev{display:grid;place-items:center;margin:0 0 18px}
.phbtn{position:relative;border:0;background:none;padding:0;cursor:pointer;display:block}
.phbtn::after{content:"✎";position:absolute;right:-2px;bottom:-2px;width:19px;height:19px;border-radius:50%;
  background:var(--gold);color:#2a1607;font-size:11px;font-weight:900;display:grid;place-items:center;
  border:2px solid var(--card);opacity:0;transition:opacity .15s}
.phbtn:hover::after{opacity:1}

/* ---- attendance grid ---- */

/* ---- height / wingspan: always feet and inches ---- */
/* accepts 5-4, 5'4", 5' 4", 64in, 64", or a bare number, and normalises it */
function parseHW(raw){
  if(raw==null)return null;
  const t=String(raw).trim(); if(!t)return null;
  /* inches-only first, otherwise 48in reads as 48 feet */
  let m=t.match(/^(\d{1,3}(?:\.\d+)?)\s*(?:"|in\b|inch|inches)$/i);
  if(m) return inchesToHW(+m[1]);
  m=t.match(/^(\d{1,2})\s*(?:'|ft\b|feet|-|\s)\s*(\d{1,2}(?:\.\d+)?)?\s*(?:"|in\b|inch|inches)?$/i);
  if(m){
    const ft=+m[1], inch=m[2]==null?0:+m[2];
    if(ft<=8 && inch<12) return {ft:ft,inch:inch};
  }
  m=t.match(/^(\d{1,3}(?:\.\d+)?)$/);
  if(m){ const n=+m[1]; return n>=12 ? inchesToHW(n) : {ft:Math.floor(n),inch:Math.round((n%1)*12)}; }
  return null;
}
function inchesToHW(n){ return {ft:Math.floor(n/12), inch:Math.round(n%12)}; }
function fmtHW(raw){
  const h=parseHW(raw); if(!h)return raw==null?null:String(raw);
  return h.ft+String.fromCharCode(39)+h.inch+String.fromCharCode(34);
}

function hwField(id,label,cur){
  const h=parseHW(cur)||{ft:'',inch:''};
  return '<div class="field"><label>'+label+'</label>'+
    '<div class="hw">'+
      '<span class="hwbox"><input class="inp hwin" id="'+id+'-ft" inputmode="numeric" maxlength="1" '+
        'placeholder="–" value="'+(h.ft===''?'':h.ft)+'"><i>'+String.fromCharCode(39)+'</i></span>'+
      '<span class="hwbox"><input class="inp hwin" id="'+id+'-in" inputmode="numeric" maxlength="2" '+
        'placeholder="–" value="'+(h.inch===''?'':h.inch)+'"><i>'+String.fromCharCode(34)+'</i></span>'+
    '</div></div>';
}
function hwValue(id){
  const ftEl=$(id+'-ft'), inEl=$(id+'-in');
  if(!ftEl||!inEl)return null;
  const ft=ftEl.value.trim(), inch=inEl.value.trim();
  if(ft===''&&inch==='')return null;
  const F=Math.max(0,Math.min(8,+ft||0));
  let I=Math.max(0,Math.round(+inch||0));
  const total=F*12+I;
  const h=inchesToHW(total);
  return h.ft+String.fromCharCode(39)+h.inch+String.fromCharCode(34);
}

/* attendance rate + effort average across the active season */
function attStats(pid){
  const ids=new Set(sessionsSorted().map(x=>x.id));
  const rows=S.att.filter(a=>a.player_id===pid&&ids.has(a.session_id));
  const held=rows.length;
  const present=rows.filter(a=>a.status==='present'||a.status==='late').length;
  const eff=rows.filter(a=>a.effort!=null).map(a=>a.effort);
  return {held,present,pct:held?Math.round(present/held*100):null,
    effort:eff.length?Math.round(eff.reduce((x,y)=>x+y,0)/eff.length*10)/10:null, streak:streakOf(pid)};
}
function streakOf(pid){
  let n=0;
  for(const s of sessionsSorted()){
    const a=attOf(s.id,pid); if(!a)break;
    if(a.status==='present'||a.status==='late')n++; else break;
  }
  return n;
}
/* creed averages, 1-4 each */
const CREED=[['force_v','FORCE','Play with force. Nothing at half speed.'],

  const ids=new Set(sessionsSorted().map(x=>x.id));
  const rows=S.creed.filter(c=>c.player_id===pid&&ids.has(c.session_id));
  if(!rows.length)return null;
  const out={n:rows.length};
  CREED.forEach(([k])=>{
    const v=rows.map(r=>r[k]).filter(x=>x!=null);
    out[k]=v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10:null;});

  out.overall=all.length?Math.round(all.reduce((a,b)=>a+b,0)/all.length*10)/10:null;
  return out;
}

const SC=()=>Object.assign({mid:70,spread:10,floor:35,cap:99,k:10},S.settings.scale||{});
const activeAttrs=()=>S.attrs.filter(a=>a.is_active!==false).sort((a,b)=>(a.sort_idx??0)-(b.sort_idx??0));
const activeTests=()=>S.tests.filter(t=>t.is_active!==false).sort((a,b)=>(a.sort_idx??0)-(b.sort_idx??0));
const visPlayers=()=>S.players.filter(p=>!S.grades.length||S.grades.includes(p.grade));

/* ratings compare an athlete against peers — either their school grade or their team */
function cohortMode(){return (S.settings&&S.settings.cohort)||'grade';}
function teamsOf(pid){return S.members.filter(m=>m.player_id===pid).map(m=>m.group_id);}
function cohortPeers(player){
  if(!player)return [];
  if(cohortMode()==='team'){
    const t=teamsOf(player.id);
    if(t.length) return S.players.filter(x=>teamsOf(x.id).some(g=>t.includes(g)));
    return [];   // no team set -> fall through to the program baseline
  }
  return S.players.filter(x=>x.grade===player.grade);
}
function cohortName(player){
  if(cohortMode()==='team'){
    const t=teamsOf(player.id).map(id=>(S.groups.find(g=>g.id===id)||{}).name).filter(Boolean);
    return t.length?t.join(' / '):'no team';
  }
  return 'grade '+(player.grade==null?'–':player.grade);
}
function latestResult(pid,tk){
  const rs=S.results.filter(r=>r.player_id===pid&&r.test_key===tk)
    .sort((a,b)=>String(b.tested_at).localeCompare(String(a.tested_at)));
  return rs.length?rs[0]:null;
}
function priorResult(pid,tk){
  const rs=S.results.filter(r=>r.player_id===pid&&r.test_key===tk)
    .sort((a,b)=>String(b.tested_at).localeCompare(String(a.tested_at)));
  return rs.length>1?rs[1]:null;
}
function cohort(tk,player){
  const vals=cohortPeers(player).map(p=>latestResult(p.id,tk)).filter(Boolean).map(r=>+r.value);
  if(!vals.length) return {n:0,mean:0,sd:0};
  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  const sd=vals.length>1?Math.sqrt(vals.reduce((s,v)=>s+(v-mean)**2,0)/(vals.length-1)):0;
  return {n:vals.length,mean,sd};
}
/* whole-program spread for a test (fallback when a grade cohort is too small to be meaningful) */
function poolStats(tk){
  const vals=S.players.map(p=>latestResult(p.id,tk)).filter(Boolean).map(r=>+r.value);
  if(!vals.length)return {n:0,mean:0,sd:0};
  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  const sd=vals.length>1?Math.sqrt(vals.reduce((s,v)=>s+(v-mean)**2,0)/(vals.length-1)):0;
  return {n:vals.length,mean,sd};
}
/* raw test value -> 0..99.
   Grade cohort is the target, but with <4 tested it's statistically meaningless
   (with n=2 every z is +/-0.707 regardless of the actual score), so we shrink it
   toward a baseline: an admin-entered norm if one exists, else the whole-program spread. */
function testRating(tk,player,value){
  const t=S.tests.find(x=>x.key===tk); if(!t||value==null||isNaN(value))return null;
  const sc=SC(), flip=t.lower_is_better?-1:1;
  const c=cohort(tk,player), pool=poolStats(tk);
  const nm=S.norms.find(n=>n.test_key===tk&&+n.grade===+(player&&player.grade));
  let zBase=0;
  if(nm&&+nm.sd>0) zBase=((value-+nm.mean)/+nm.sd)*flip;
  else if(pool.n>2&&pool.sd>0) zBase=((value-pool.mean)/pool.sd)*flip;
  const zGrade=(c.n>3&&c.sd>0)?((value-c.mean)/c.sd)*flip:null;
  const k=+sc.k||10, n=c.n;
  const z = zGrade==null ? zBase : zGrade*(n/(n+k))+zBase*(k/(n+k));
  return Math.max(sc.floor,Math.min(sc.cap,Math.round(sc.mid+sc.spread*z)));
}
/* what a rating is currently being measured against — shown in the player breakdown */
function basisFor(tk,player){
  const c=cohort(tk,player), pool=poolStats(tk);
  const nm=S.norms.find(n=>n.test_key===tk&&+n.grade===+(player&&player.grade));
  if(c.n>3) return cohortName(player)+' ('+c.n+' tested)';
  if(nm) return 'grade norm';
  if(pool.n>2) return 'whole program ('+pool.n+' tested)';
  return 'not enough data';
}
const coachTo100=s=>Math.round(40+(s-1)*(60/9));
function coachAvg(pid,attrKey){
  const v=S.coachScores.filter(s=>s.player_id===pid&&s.category===attrKey).map(s=>+s.value);
  return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;
}
/* attribute = weighted blend of its tests + the coach's eye */
function attrRating(pid,attrKey){
  const p=S.players.find(x=>x.id===pid); if(!p)return {rating:null,inputs:0};
  const a=S.attrs.find(x=>x.key===attrKey); if(!a)return {rating:null,inputs:0};
  let num=0,den=0,inputs=0,parts=[];
  S.weights.filter(w=>w.attribute_key===attrKey).forEach(w=>{
    const r=latestResult(pid,w.test_key); if(!r)return;
    const rt=testRating(w.test_key,p,+r.value); if(rt==null)return;
    num+=rt*+w.weight; den+=+w.weight; inputs++;
    parts.push({kind:'test',key:w.test_key,rating:rt,weight:+w.weight,raw:+r.value});
  });
  const cw=+a.coach_weight||0;
  if(cw>0){ const cs=coachAvg(pid,attrKey);
    if(cs!=null){ const rt=coachTo100(cs); num+=rt*cw; den+=cw; inputs++;
      parts.push({kind:'coach',rating:rt,weight:cw,raw:Math.round(cs*10)/10}); } }
  return den>0?{rating:Math.round(num/den),inputs,parts}:{rating:null,inputs:0,parts};
}
function playerRatings(pid){
  const out={}; activeAttrs().forEach(a=>out[a.key]=attrRating(pid,a.key)); return out;
}
function ovrOf(pid){
  const r=playerRatings(pid); let num=0,den=0,have=0;
  activeAttrs().forEach(a=>{ const x=r[a.key]; if(x.rating==null)return;
    num+=x.rating*(+a.weight||1); den+=(+a.weight||1); have++; });
  const total=activeAttrs().length;
  return {ovr:den>0?Math.round(num/den):null,coverage:total?have/total:0,ratings:r};
}
function lastSnap(pid){
  const s=S.snaps.filter(x=>x.player_id===pid).sort((a,b)=>String(b.as_of).localeCompare(String(a.as_of)));
  return s.length?s[0]:null;
}
function deltaFor(pid,key,cur){
  const s=lastSnap(pid); if(!s||cur==null)return null;
  const prev=key==='ovr'?s.ovr:(s.attributes_json||{})[key];
  if(prev==null)return null; const d=Math.round(cur-prev); return d;
}
function ratingColor(v){
  if(v==null)return 'rgba(255,255,255,.2)';
  if(v>=90)return '#F4C84B'; if(v>=80)return '#A66BF2';
  if(v>=70)return '#5ee6a0'; if(v>=60)return '#e3c33a'; return '#ff8f6b';
}
const dEl=d=>d==null?'':`<span class="delta ${d>0?'up':d<0?'down':'flat'}">${d>0?'▲'+d:d<0?'▼'+Math.abs(d):'–'}</span>`;

function vCards(){
  const rows=visPlayers().map(p=>({p,...ovrOf(p.id)}))
    .sort((a,b)=>(b.ovr??-1)-(a.ovr??-1));
  return `<div class="sec"><h2>PLAYER CARDS</h2><div class="rule"></div>
      <button class="btn btn-g btn-s" data-act="snap">📌 Save Checkpoint</button></div>
    <p class="lead">Ratings are <b>0–100, relative to grade level</b>. Tap a card for the full breakdown.</p>
    ${gradeBar()}
    ${rows.length?`<div class="cards">${rows.map(cardHTML).join('')}</div>`
      :`<div class="empty"><div class="ico">🏀</div><div>No players yet — add them in the Tryouts app roster.</div></div>`}`;
}
function cardHTML({p,ovr,coverage,ratings}){
  const min=+S.settings.provisional_min_inputs||2;
  const inputs=Object.values(ratings).reduce((s,r)=>s+r.inputs,0);
  const prov=inputs<min*2||coverage<.5;
  const top=activeAttrs().slice(0,6);
  const at=attStats(p.id), cr=creedAvg(p.id);
  const strip=(at.held||cr)?`<div class="pstrip">`+
    (at.pct!=null?`<div class="pstat"><b>${at.pct}%</b><span>Attend</span></div>`:'')+
    (at.streak>1?`<div class="pstat gold"><b>${at.streak}</b><span>Streak</span></div>`:'')+
    (cr&&cr.overall!=null?`<div class="pstat gold"><b>${cr.overall}</b><span>Creed</span></div>`:'')+
    `</div>`:'';
  return `<div class="pcard ${ovr>=90?'t-elite':''}" data-p="${p.id}">
    ${prov?'<span class="prov">PROVISIONAL</span>':''}
    <div class="pcard-top">
      <button class="phbtn" data-photo="${p.id}" title="Set photo">${photoChip(p,46)}</button>
      <div class="jersey">${p.number??'–'}</div>
      <div style="min-width:0"><div class="pname">${esc(p.name)}</div>
        <div class="pmeta">Grade ${p.grade??'–'}${p.height?' · '+esc(fmtHW(p.height)):''}</div></div>
      <div class="ovr"><b style="color:${ratingColor(ovr)}">${ovr??'–'}</b><span>OVR${dEl(deltaFor(p.id,'ovr',ovr))}</span></div>
    </div>
    <div class="bars">${top.map(a=>{const r=ratings[a.key];const v=r.rating;
      return `<div class="brow"><span class="blab">${esc(a.label)}</span>
        <span class="btrack"><i class="bfill" style="width:${v==null?0:v}%;background:${ratingColor(v)}"></i></span>
        <span class="bval" style="color:${ratingColor(v)}">${v??'–'}</span></div>`}).join('')}</div>
    ${strip}
  </div>`;
}

function seasonAvgTable(){
  const rows=visPlayers().map(p=>{
    const ln=S.stats.filter(s=>s.player_id===p.id); if(!ln.length)return null;
    const g=ln.length,sum=k=>ln.reduce((a,b)=>a+(+b[k]||0),0);
    return {p,g,pts:sum('pts')/g,reb:(sum('oreb')+sum('dreb'))/g,ast:sum('ast')/g,
      stl:sum('stl')/g,blk:sum('blk')/g,tov:sum('tov')/g,
      fg:sum('fga')?100*sum('fgm')/sum('fga'):null};
  }).filter(Boolean).sort((a,b)=>b.pts-a.pts);
  if(!rows.length)return '';
  const f=v=>v==null?'–':(Math.round(v*10)/10).toFixed(1);
  return `<div class="sec" style="margin-top:26px"><h2 style="font-size:1.15rem">SEASON AVERAGES</h2><div class="rule"></div></div>
   <div class="wrap"><div class="scroll"><table>

    <tbody>${rows.map(r=>`<tr><td><div class="cell l"><b>${esc(r.p.name)}</b></div></td>
      <td><div class="cell">${r.g}</div></td><td><div class="cell" style="color:var(--gold-br)">${f(r.pts)}</div></td>
      <td><div class="cell">${f(r.reb)}</div></td><td><div class="cell">${f(r.ast)}</div></td>
      <td><div class="cell">${f(r.stl)}</div></td><td><div class="cell">${f(r.blk)}</div></td>
      <td><div class="cell">${f(r.tov)}</div></td><td><div class="cell">${r.fg==null?'–':f(r.fg)+'%'}</div></td></tr>`).join('')}

/* everything worth knowing about one player, in one row */
function reportRow(p){
  const {ovr}=ovrOf(p.id);
  const objs=S.objectives.filter(o=>o.player_id===p.id);
  const tks=S.tasks.filter(t=>t.player_id===p.id);
  const assigned=assignedFor(p.id);
  const seen=assigned.filter(m=>watched(p.id,m.did,m.vid)).length;
  const tested=activeTests().filter(t=>latestResult(p.id,t.key)).length;
  const dates=S.results.filter(r=>r.player_id===p.id).map(r=>String(r.tested_at)).sort();
  return {p,ovr,d:deltaFor(p.id,'ovr',ovr),
    objDone:objs.filter(o=>o.done).length,objN:objs.length,
    tkDone:tks.filter(taskDone).length,tkN:tks.length,
    seen,assignedN:assigned.length,
    tested,testN:activeTests().length,
    lastTest:dates.length?dates[dates.length-1]:null,
    prio:weakest(p.id,playerRatings(p.id))};
}

}

function statCard(label,val){
  return '<div class="note" style="flex:1;min-width:130px;margin-bottom:0;text-align:center">'+
    '<div class="note-h" style="margin-bottom:3px">'+label+'</div>'+

}
function printDate(){try{return new Date().toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});}catch(e){return '';}}
function reportCard(p){
  const {ovr,ratings}=ovrOf(p.id);
  const snap=lastSnap(p.id);
  const gains=[];
  activeTests().forEach(t=>{const cur=latestResult(p.id,t.key),pr=priorResult(p.id,t.key);
    if(cur&&pr){const d=+cur.value-+pr.value;const better=t.lower_is_better?d<0:d>0;
      if(d!==0)gains.push({t,from:+pr.value,to:+cur.value,better});}});
  const prio=weakest(p.id,ratings);
  return `<div class="note">
    <div class="row" style="justify-content:space-between">
      <div><b style="font-size:1.05rem">${esc(p.name)}</b>
        <span class="chip" style="margin-left:6px">Grade ${p.grade??'–'}</span></div>
      <div style="text-align:right;line-height:1"><b style="font-family:var(--disp);font-size:1.7rem;color:${ratingColor(ovr)}">${ovr??'–'}</b>
        <span style="font-size:.6rem;letter-spacing:.15em;color:var(--tx-d)">OVR${dEl(deltaFor(p.id,'ovr',ovr))}</span></div>
    </div>
    ${gains.length?`<div style="margin-top:10px"><div class="note-h">Raw improvement</div>
      ${gains.map(g=>`<span class="chip" style="margin:2px 4px 2px 0">${esc(g.t.label)} <b style="color:${g.better?'#5ee6a0':'#ff8f6b'}">${g.from} → ${g.to}</b></span>`).join('')}</div>`
      :`<div style="margin-top:8px;color:var(--tx-d);font-size:.84rem">Only one test on file — re-test to show growth.</div>`}
    ${prio?`<div style="margin-top:11px"><div class="note-h">Development priority</div>
      <div style="color:var(--tx-s)"><b style="color:var(--pur-br)">${esc(prio.label)}</b> — ${prio.rating} vs their ${prio.avg} average.
      ${prio.drills.length?`Suggested: ${prio.drills.map(d=>`<span class="tag">${esc(d.name)}</span>`).join(' ')}`:`<span style="color:var(--tx-d)">Tag drills with "${esc(prio.key)}" to get suggestions.</span>`}</div></div>`:''}
    ${!snap?`<div style="margin-top:9px;color:var(--tx-d);font-size:.8rem">No checkpoint saved yet — save one on Player Cards to start tracking deltas.</div>`:''}
  </div>`;
}
/* biggest gap vs the player's own average -> the thing to coach next */
function weakest(pid,ratings){
  const vals=activeAttrs().map(a=>({a,r:ratings[a.key]?.rating})).filter(x=>x.r!=null);
  if(vals.length<3)return null;
  const avg=Math.round(vals.reduce((s,x)=>s+x.r,0)/vals.length);
  const low=vals.slice().sort((x,y)=>x.r-y.r)[0];
  const drills=S.drills.filter(d=>(d.tags||[]).some(t=>t.toLowerCase()===low.a.key.toLowerCase()
    ||t.toLowerCase()===low.a.label.toLowerCase())).slice(0,3);
  return {key:low.a.key,label:low.a.label,rating:low.r,avg,drills};
}

/* ---- Weekly reset: wipe a grade's assignments so next week's can go out ---- */
function assignmentsMatching(target,cat){
  return S.assigns.filter(a=>{
    if(target!=='all'){
      const isTeam=a.scope==='group'&&a.scope_value===target;
      if(!isTeam) return false;
    }
    if(cat==='all')return true;
    // resolve what the assignment points at
    const mids=[];
    if(a.drill_id)mids.push('d:'+a.drill_id);
    if(a.video_id)mids.push('v:'+a.video_id);
    if(a.list_id)listDrills(a.list_id).forEach(m=>mids.push(m.mid));
    return mids.some(mid=>{const m=findMedia(mid); if(!m)return false;
      return cat==='drill'?!['practice','gamebreakdown'].includes(m.cat):m.cat===cat;});
  });
}

    if(el)el.innerHTML=hits.length

      '<div class="field"><label>Category</label><select class="inp" id="cw-cat">'+

        '<option value="drill">My Drills</option><option value="all">Everything</option></select></div>'+
    '</div>'+

/* ---- Admin: parent access codes ---- */
function randCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let o='';for(let i=0;i<4;i++)o+=A[Math.floor(Math.random()*A.length)];return 'JAG-'+o;}
/* A stable code derived from the player id, so parent codes work even before
   the pd_access table exists. An explicitly issued pd_access row always wins. */
function derivedCode(pid){
  const s=String(pid||''); let h=2166136261;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let n=Math.abs(h),o='';
  for(let i=0;i<4;i++){o+=A[n%A.length];n=Math.floor(n/A.length);}
  return 'JAG-'+o;
}
function codeFor(pid){const ac=S.access.find(x=>x.player_id===pid&&!x.revoked_at);return ac?ac.code:derivedCode(pid);}

    + '</p>';

    '</tbody></table></div></div>':'<div class="empty"><div class="ico">🔑</div><div>Add players first.</div></div>');

async function makeCode(pid){
  const old=S.access.filter(a=>a.player_id===pid&&!a.revoked_at);
  for(const o of old){await del('pd_access',o.id); S.access=S.access.filter(x=>x.id!==o.id);}

}

  if(t.done)return true;
  if(!t.auto_on_watch)return false;
  if(t.video_id)return watched(t.player_id,null,t.video_id);
  if(t.drill_id)return watched(t.player_id,t.drill_id,null);
  return false;}
function objFor(pid){return S.objectives.filter(o=>o.player_id===pid)
  .sort((a,b)=>String(a.due_date||'9999').localeCompare(String(b.due_date||'9999')));}
function tasksFor(pid){return S.tasks.filter(t=>t.player_id===pid)
  .sort((a,b)=>String(a.due_date||'9999').localeCompare(String(b.due_date||'9999')));}
function dueChip(d){
  if(!d)return '';
  const today=new Date().toISOString().slice(0,10);

  return '<span class="chip" style="'+(late?'border-color:rgba(255,128,128,.4);color:#ff9d9d':'')+'">'+(late?'⚠ ':'')+'due '+esc(String(d))+'</span>';
}

function scopeToPlayers(scope,val){

  const cur=currentGoalPlayer(); return cur?[cur]:[];
}

/* one shape for a local drill or a Warriors training video */
function vidUrl(v){return v.youtube_id?('https://www.youtube.com/watch?v='+v.youtube_id):null;}
function ytId(u){const m=String(u||'').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);return m?m[1]:null;}
function asMedia(x,kind){
  if(kind==='video'){
    const yt=x.youtube_id||null;
    return {mid:'v:'+x.id, vid:x.id, did:null, name:x.title, desc:x.summary, url:vidUrl(x),
      tags:x.tags||[], cat:x.category, yt,
      thumb:x.custom_thumb||(yt?'https://img.youtube.com/vi/'+yt+'/mqdefault.jpg':null)};
  }
  const yt=ytId(x.video_url);
  return {mid:'d:'+x.id, vid:null, did:x.id, name:x.name, desc:x.description, url:x.video_url,
    tags:x.tags||[], cat:x.kind||'drill', yt,
    thumb:yt?'https://img.youtube.com/vi/'+yt+'/mqdefault.jpg':null};
}
/* tag index across the whole library, case-insensitive with a canonical label */
function tagIndex(){
  const m=new Map();
  allMedia().forEach(x=>(x.tags||[]).forEach(t=>{
    const k=String(t).trim().toLowerCase(); if(!k)return;
    const e=m.get(k)||{label:String(t).trim(),n:0}; e.n++; m.set(k,e);}));
  return [...m.entries()].map(([k,v])=>({key:k,label:v.label,n:v.n}))
    .sort((a,b)=>b.n-a.n||a.label.localeCompare(b.label));
}
const hasTag=(m,k)=>(m.tags||[]).some(t=>String(t).trim().toLowerCase()===k);
async function addTagsTo(mids,tags){
  for(const mid of mids){
    const [k,id]=mid.split(':');
    const raw=k==='v'?S.videos.find(x=>x.id===id):S.drills.find(x=>x.id===id);
    if(!raw)continue;
    const cur=raw.tags||[];
    const merged=cur.slice();
    tags.forEach(t=>{ if(!cur.some(c=>String(c).trim().toLowerCase()===t.toLowerCase())) merged.push(t); });
    raw.tags=merged;
    await patch(k==='v'?'training_videos':'tryout_drills',id,{tags:merged});
  }
}

    '<button class="btn btn-p btn-block" id="bt-save">Apply to '+n+' item'+(n===1?'':'s')+'</button>');
  document.querySelectorAll('[data-bt]').forEach(b=>b.onclick=()=>{
    const i=$('bt-tags'); const cur=i.value.split(',').map(x=>x.trim()).filter(Boolean);
    if(!cur.some(c=>c.toLowerCase()===b.dataset.bt.toLowerCase()))cur.push(b.dataset.bt);
    i.value=cur.join(', ');});
  $('bt-save').onclick=async()=>{

}

    const url=$('pv-url')?$('pv-url').value.trim()||null:null;
    const [k,id]=mid.split(':');
    if(k==='v'){
      const row={title,summary:desc,tags}; if(cat)row.category=cat;
      const raw=S.videos.find(x=>x.id===id); if(raw)Object.assign(raw,row);
      await patch('training_videos',id,row);
    }else{
      const row={name:title,description:desc,tags,video_url:url}; if(cat)row.kind=cat;
      const raw=S.drills.find(x=>x.id===id); if(raw)Object.assign(raw,row);
      await patch('tryout_drills',id,row);
    }
    closeModal(); render(); flag('Saved');
  };
  const dl=$('pv-del'); if(dl)dl.onclick=async()=>{

    else { await del('tryout_drills',id); S.drills=S.drills.filter(x=>x.id!==id); }
    S.picked=S.picked.filter(x=>x!==mid);
    closeModal(); render(); flag('Deleted');
  };
}
function allMedia(){
  return S.drills.map(d=>asMedia(d,'drill')).concat(S.videos.map(v=>asMedia(v,'video')));
}
const CAT_LABEL={practice:'Practice',gamebreakdown:'Game Breakdown',drill:'Drill',breakdown:'Breakdown',film:'Film',skill:'Skill Work',install:'Install / Playbook'};
/* the ONE list every add/edit form uses, so a new video always lands in a bucket the portal filters on */
const CATS=[['practice','Practice'],['gamebreakdown','Game Breakdown'],['drill','Drill'],['skill','Skill Work'],['install','Install / Playbook'],['film','Game Film']];
const catOptions=(sel)=>CATS.map(([v,l])=>'<option value="'+v+'"'+(sel===v?' selected':'')+'>'+l+'</option>').join('');
function libStats(){
  const all=allMedia();
  return {total:all.length, untagged:all.filter(m=>!(m.tags||[]).length).length,
    broken:all.filter(m=>!m.url).length, unassigned:all.filter(m=>!assignsForMedia(m).length).length};
}
function assignsForMedia(m){
  return S.assigns.filter(a=>(m.did&&a.drill_id===m.did)||(m.vid&&a.video_id===m.vid));
}

const AG_LABEL={proposed:'Waiting on parent',parent_signed:'Needs your approval',approved:'Active',complete:'Complete',declined:'Declined'};

function agoalProgress(g){
  if(!g.test_key||g.target_value==null)return null;
  const r=latestResult(g.player_id,g.test_key); if(!r)return null;
  const start=g.start_value==null?0:+g.start_value, tgt=+g.target_value, cur=+r.value;
  if(tgt===start)return null;
  return Math.max(0,Math.min(100,Math.round((cur-start)/(tgt-start)*100)));
}

/* ================= COMPARE — radar overlay ================= */
function radar(series,labels){
  /* series: [{name,color,vals:[0-100...]}] */
  const R=104, CX=132, CY=126, n=labels.length;
  if(!n) return '';
  const pt=(i,r)=>{const a=(Math.PI*2*i/n)-Math.PI/2;
    return [CX+Math.cos(a)*r, CY+Math.sin(a)*r];};
  const rings=[25,50,75,100].map(p=>{
    const d=labels.map((_,i)=>pt(i,R*p/100).map(v=>v.toFixed(1)).join(',')).join(' ');
    return '<polygon points="'+d+'" fill="none" stroke="rgba(255,255,255,'+(p===100?'.22':'.10')+')" stroke-width="1"/>';}).join('');
  const spokes=labels.map((_,i)=>{const [x,y]=pt(i,R);
    return '<line x1="'+CX+'" y1="'+CY+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="rgba(255,255,255,.10)" stroke-width="1"/>';}).join('');
  const shapes=series.map(sr=>{
    const d=sr.vals.map((v,i)=>pt(i,R*Math.max(0,Math.min(100,v==null?0:v))/100).map(x=>x.toFixed(1)).join(',')).join(' ');
    return '<polygon points="'+d+'" fill="'+sr.color+'22" stroke="'+sr.color+'" stroke-width="2.5" stroke-linejoin="round"/>'+
      sr.vals.map((v,i)=>{if(v==null)return '';const [x,y]=pt(i,R*Math.max(0,Math.min(100,v))/100);
        return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3.4" fill="'+sr.color+'"/>';}).join('');
  }).join('');
  const text=labels.map((l,i)=>{const [x,y]=pt(i,R+17);
    const anc=Math.abs(x-CX)<9?'middle':(x>CX?'start':'end');
    return '<text x="'+x.toFixed(1)+'" y="'+(y+4).toFixed(1)+'" text-anchor="'+anc+'" font-size="10" font-weight="800" fill="rgba(255,255,255,.62)" font-family="Barlow Condensed, sans-serif" letter-spacing=".08em">'+esc(l.toUpperCase())+'</text>';}).join('');
  return '<svg class="radar" viewBox="-58 -10 380 272" role="img" aria-label="Attribute comparison">'+rings+spokes+shapes+text+'</svg>';
}

  const rows=activeAttrs().map((a,i)=>{

/* ================= GROWTH — season over season ================= */
function growthRows(pid){
  const snaps=S.snaps.filter(x=>x.player_id===pid)
    .sort((a,b)=>String(a.as_of).localeCompare(String(b.as_of)));
  const out=snaps.map(x=>({when:x.as_of,ovr:x.ovr,season:seasonName(x.season_id),id:x.id}));
  const now=ovrOf(pid).ovr;
  if(now!=null) out.push({when:'today',ovr:now,season:curSeason()?curSeason().name:'This season',live:true});
  return out;
}
function growthCard(pid){
  const rows=growthRows(pid);
  if(rows.length<2) return '';
  const first=rows[0], last=rows[rows.length-1];
  const d=last.ovr-first.ovr;
  const min=Math.min.apply(null,rows.map(r=>r.ovr))-4, max=Math.max.apply(null,rows.map(r=>r.ovr))+4;
  const W=460,H=92, span=Math.max(1,max-min);
  const pts=rows.map((r,i)=>[8+i*((W-16)/Math.max(1,rows.length-1)), H-6-((r.ovr-min)/span)*(H-16)]);
  const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area='8,'+(H-6)+' '+line+' '+(W-8)+','+(H-6);
  return '<div class="growth"><div class="growthead"><b>Growth</b>'+
      '<span class="delta '+(d>0?'up':d<0?'down':'flat')+'">'+(d>0?'▲'+d:d<0?'▼'+Math.abs(d):'no change')+'</span>'+
      '<span class="gsub">'+esc(first.when)+' → '+esc(last.when)+'</span></div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" class="gsvg">'+
      '<polygon points="'+area+'" fill="rgba(240,168,60,.14)"/>'+
      '<polyline points="'+line+'" fill="none" stroke="#F0A83C" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
      pts.map((p,i)=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(i===pts.length-1?4:3)+'" fill="#F0A83C"/>').join('')+
    '</svg>'+
    '<div class="gticks">'+rows.map(r=>'<span><b>'+r.ovr+'</b>'+esc(r.when==='today'?'now':String(r.when).slice(5))+'</span>').join('')+'</div></div>';
}

function photoChip(p,sz){
  const url=p&&p.photo_url;

async function cycleAtt(sid,pid){
  const a=attOf(sid,pid);
  let next;
  if(!a) next={status:'present',effort:null};
  else if(a.status==='present'&&a.effort!==3) next={status:'present',effort:3};
  else if(a.status==='present'&&a.effort===3) next={status:'absent',effort:null};
  else next={status:'present',effort:null};
  if(a){ Object.assign(a,next); render(); await patch('pd_attendance',a.id,next); }
  else { const row=Object.assign({session_id:sid,player_id:pid},next);
    const tmp=Object.assign({id:uuid()},row); S.att.push(tmp); render();
    const saved=await put('pd_attendance',row);
    if(saved){const i=S.att.indexOf(tmp); if(i>=0)S.att[i]=saved;} }
}
async function setCreed(sid,pid,key,val){
  const c=creedOf(sid,pid);
  const v=(c&&c[key]===val)?null:val;
  const one={}; one[key]=v;
  if(c){ c[key]=v; render(); await patch('pd_creed',c.id,one); }
  else { const row=Object.assign({session_id:sid,player_id:pid},one);
    const tmp=Object.assign({id:uuid()},row); S.creed.push(tmp); render();
    const saved=await put('pd_creed',row);
    if(saved){const i=S.creed.indexOf(tmp); if(i>=0)S.creed[i]=saved;} }
}
async function markAllPresent(sid){
  const sess=S.sessions.find(x=>x.id===sid); if(!sess)return;
  for(const p of rosterFor(sess.group_id)){
    if(attOf(sid,p.id))continue;
    const row={session_id:sid,player_id:p.id,status:'present',effort:null};
    const saved=await put('pd_attendance',row);
    S.att.push(saved||Object.assign({id:uuid()},row));
  }
  render(); flag('Everyone marked here');
}

function assignedFor(pid){
  const p=S.players.find(x=>x.id===pid); if(!p)return [];
  const gids=S.members.filter(m=>m.player_id===pid).map(m=>m.group_id);
  const mine=S.assigns.filter(a=>a.scope==='all'
    ||(a.scope==='grade'&&+a.scope_value===+p.grade)
    ||(a.scope==='group'&&gids.includes(a.scope_value))
    ||(a.scope==='player'&&a.scope_value===pid));
  const ids=new Set();
  const mids=new Set();
  mine.forEach(a=>{ if(a.drill_id) mids.add('d:'+a.drill_id);

    if(a.list_id) listDrills(a.list_id).forEach(m=>mids.add(m.mid)); });
  return allMedia().filter(m=>mids.has(m.mid));
}

      : v==='group'

      : v==='grade'

  document.querySelectorAll('[data-unassign]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.unassign; S.assigns=S.assigns.filter(a=>a.id!==id); await del('pd_assignments',id); closeModal(); render(); flag('Removed');});
  $('as-save').onclick=async()=>{
    const scope=$('as-scope').value;
    const reps=parseInt($('as-reps').value)||null, due=$('as-due').value||null;
    const mk=async v=>{const row=isList?{list_id:listId,scope,scope_value:v,reps_target:reps,due_date:due}
      :Object.assign({scope,scope_value:v,reps_target:reps,due_date:due}, kind==='v'?{video_id:rid}:{drill_id:rid});
      const saved=await put('pd_assignments',row); S.assigns.push(saved||{id:uuid(),...row});};
    if(scope==='player'){const picks=[...document.querySelectorAll('[data-pick].on')].map(b=>b.dataset.pick);
      if(!picks.length)return; for(const p of picks) await mk(p);}
    else if(scope==='all') await mk(null);
    else await mk($('as-val').value);
    closeModal(); render(); flag('Assigned');
  };
}

          ${BOX.map(k=>`<td><input class="nin" style="width:52px" inputmode="numeric" value="${st[k]??''}" data-box="${p.id}" data-k="${k}" data-g="${gid}"></td>`).join('')}
        </tr>`}).join('')}</tbody></table></div></div>
    <p class="lead" style="margin-top:10px">Saves as you type.</p>`,true);
  document.querySelectorAll('[data-box]').forEach(inp=>inp.onchange=async()=>{
    const pid=inp.dataset.box,k=inp.dataset.k,v=inp.value===''?null:+inp.value;
    let st=S.stats.find(s=>s.game_id===gid&&s.player_id===pid);
    if(!st){st={id:uuid(),game_id:gid,player_id:pid};S.stats.push(st);}
    st[k]=v;
    const row={game_id:gid,player_id:pid}; BOX.forEach(kk=>{ if(st[kk]!=null) row[kk]=st[kk]; });
    const saved=await put('pd_stats',row,'game_id,player_id'); if(saved)st.id=saved.id;
    flag('Saved');});
}

    const [k,rid]=mid.split(':');
    const it=S.listItems.find(i=>i.list_id===lid&&(k==='v'?i.video_id===rid:i.drill_id===rid)); if(!it)return;
    S.listItems=S.listItems.filter(i=>i.id!==it.id); await del('pd_list_items',it.id); render(); flag('Removed');});
  document.querySelectorAll('[data-listdel]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.listdel; S.lists=S.lists.filter(l=>l.id!==id);
    S.listItems=S.listItems.filter(i=>i.list_id!==id); S.openList=null;
    await del('pd_lists',id); render(); flag('List deleted');});
  document.querySelectorAll('[data-objtog]').forEach(b=>b.onclick=async()=>{
    const o=S.objectives.find(x=>x.id===b.dataset.objtog); if(!o)return;
    o.done=!o.done; o.done_at=o.done?new Date().toISOString():null;
    await patch('pd_objectives',o.id,{done:o.done,done_at:o.done_at}); render(); flag(o.done?'Completed':'Reopened');});
  document.querySelectorAll('[data-objdel]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.objdel; S.objectives=S.objectives.filter(x=>x.id!==id); await del('pd_objectives',id); render();});
  document.querySelectorAll('[data-tasktog]').forEach(b=>b.onclick=async()=>{
    const t=S.tasks.find(x=>x.id===b.dataset.tasktog); if(!t)return;
    t.done=!taskDone(t); t.done_at=t.done?new Date().toISOString():null;
    await patch('pd_tasks',t.id,{done:t.done,done_at:t.done_at}); render();});
  document.querySelectorAll('[data-taskdel]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.taskdel; S.tasks=S.tasks.filter(x=>x.id!==id); await del('pd_tasks',id); render();});
  const acts={
    'new-attr':()=>attrModal(),'new-test':()=>testModal(),'new-weight':()=>weightModal(),
    'new-group':()=>groupModal(),'new-drill':()=>drillModal(),'new-game':()=>gameModal(),
    'snap':saveCheckpoint,'save-scale':saveScale,
    'new-msg':()=>msgModal(),'new-player':()=>playerEditModal(),'bulk-player':()=>bulkPlayerModal(),
    'clear-week':()=>clearWeekModal(),
    'bulk-tag':()=>bulkTagModal(),
    'bulk-import':()=>bulkImportModal(),
    'new-session':()=>sessionModal(null),
    'edit-session':()=>{const l=sessionsSorted();const sx=S.prSession?l.find(x=>x.id===S.prSession)||l[0]:l[0];if(sx)sessionModal(sx.id);},
    'all-present':()=>{const l=sessionsSorted();const sx=S.prSession?l.find(x=>x.id===S.prSession)||l[0]:l[0];if(sx)markAllPresent(sx.id);},
    'new-season':()=>seasonModal(null),
    'roll-season':()=>rollSeasonModal(),
    'lib-export':()=>libExport(),
    'lib-reset':()=>{S.libQ='';S.libCat='all';S.assignTags=[];render();},
    'bulk-clear':()=>{S.picked=[];render();},
    'bulk-assign':()=>{ if(S.picked.length) assignModal(S.picked[0]); },
    'edit-creed':()=>creedModal(),'new-welcome':()=>welcomeModal(),'new-doc':()=>docModal(),'new-obj':()=>objModal(),'new-task':()=>taskModal(),'new-list':()=>listModal(),
    'list-back':()=>{S.openList=null;render();},
    'codes-all':async()=>{for(const pl of S.players){ if(!S.access.find(a=>a.player_id===pl.id&&!a.revoked_at)) await makeCode(pl.id);} render(); flag('Codes generated');}};
  document.querySelectorAll('[data-act]').forEach(b=>{const f=acts[b.dataset.act]; if(f)b.onclick=f;});
}
async function saveCheckpoint(){
  const today=new Date().toISOString().slice(0,10);
  for(const p of S.players){
    const {ovr,ratings}=ovrOf(p.id); if(ovr==null)continue;
    const aj={}; Object.keys(ratings).forEach(k=>{if(ratings[k].rating!=null)aj[k]=ratings[k].rating;});
    const row=stamp({player_id:p.id,as_of:today,ovr,attributes_json:aj,trigger:'manual'});
    const s=await put('pd_snapshots',row); S.snaps.push(s||{id:uuid(),...row});
  }
  render(); flag('Checkpoint saved');
}
async function saveScale(){
  const v={mid:+$('sc-mid').value||70,spread:+$('sc-spread').value||10,
    floor:+$('sc-floor').value||35,cap:+$('sc-cap').value||99,k:+$('sc-k').value||10};
  S.settings.scale=v; await put('pd_settings',{key:'scale',value:v},'key');
  render(); flag('Scale saved');
}

await loadAll(); subscribe(); render();
</script>
