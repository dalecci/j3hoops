<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#25104A"/>
<title>Jaguars · Athlete Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --pur-900:#170733; --pur-800:#25104A; --pur-700:#3A1A6B; --pur-600:#4E2489; --pur-400:#8B5CD6;
  --gold:#F0A83C; --gold-lt:#FFC96B; --gold-dk:#C77F1E;
  --ink:#fff; --ink-s:rgba(255,255,255,.80); --ink-m:rgba(255,255,255,.58); --ink-d:rgba(255,255,255,.34);
  --line:rgba(255,255,255,.13); --line-s:rgba(255,255,255,.07);
  --panel:rgba(255,255,255,.045);
  --good:#54E08A; --bad:#FF7A6B;
  --disp:'Archivo Black',system-ui,sans-serif;
  --cond:'Barlow Condensed',system-ui,sans-serif;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--pur-900)}
body{font-family:var(--sans);color:var(--ink);line-height:1.5;min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  background:
    radial-gradient(1000px 620px at 78% -8%, rgba(240,168,60,.13), transparent 62%),
    radial-gradient(900px 700px at -12% 8%, rgba(139,92,214,.24), transparent 60%),
    linear-gradient(180deg,var(--pur-800),var(--pur-900) 62%);
  background-attachment:fixed;padding-bottom:88px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.pad{height:24px}

/* ===== gate ===== */
.gate{min-height:88vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gate-in{width:100%;max-width:400px;text-align:center}
.gate-crest{width:118px;height:118px;margin:0 auto 20px;display:block;
  filter:drop-shadow(0 18px 40px rgba(0,0,0,.6))}
.gate-in .kick{font-family:var(--cond);font-size:.86rem;font-weight:700;letter-spacing:.28em;
  text-transform:uppercase;color:var(--gold-lt)}
.gate-in h1{font-family:var(--disp);font-size:2.1rem;line-height:1.02;letter-spacing:-.02em;margin-top:4px}
.gate-in p{color:var(--ink-m);margin:10px 0 22px;font-size:.92rem}
.codein{width:100%;padding:16px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.28);
  color:#fff;font-size:1.4rem;font-weight:800;text-align:center;letter-spacing:.14em;text-transform:uppercase;
  font-family:var(--disp)}
.codein:focus{outline:none;border-color:var(--gold);background:rgba(240,168,60,.09)}
.err{color:var(--bad);font-size:.85rem;font-weight:700;min-height:20px;margin-top:9px}

/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;border-radius:12px;
  font-weight:800;font-size:.88rem;transition:.15s}
.btn-p{background:linear-gradient(135deg,var(--gold),var(--gold-dk));color:#2B1200;
  box-shadow:0 10px 24px -12px var(--gold)}
.btn-p:hover{filter:brightness(1.06)}
.btn-g{border:1px solid var(--line);background:var(--panel);color:var(--ink-s)}
.btn-g:hover{border-color:var(--gold);color:#fff}
.btn-block{width:100%}
.btn-s{padding:8px 14px;font-size:.79rem;border-radius:10px}

/* ===== header ===== */
.top{position:relative;overflow:hidden;padding:18px 16px 0;
  background:linear-gradient(160deg,var(--pur-700),var(--pur-900));border-bottom:1px solid var(--line)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--gold-dk),var(--gold-lt),var(--gold-dk))}
.top-mark{position:absolute;right:-58px;top:-44px;width:220px;opacity:.12;pointer-events:none}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:14px;position:relative}
.crest{width:54px;height:54px;flex-shrink:0}
.who{min-width:0;flex:1}
.who .eyebrow{font-family:var(--cond);font-size:.78rem;font-weight:700;letter-spacing:.24em;
  text-transform:uppercase;color:var(--gold-lt)}
.who h1{font-family:var(--disp);font-size:1.4rem;line-height:1.05;letter-spacing:-.01em;margin-top:1px}
.who .sub{font-size:.75rem;color:var(--ink-m);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sign{font-family:var(--cond);font-size:.82rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-m);border:1px solid var(--line);border-radius:999px;padding:7px 13px;flex-shrink:0}
.sign:hover{color:#fff;border-color:var(--gold)}
.kids{max-width:680px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:13px 0 13px;scrollbar-width:none}
.kids::-webkit-scrollbar{display:none}
.kidc{display:flex;align-items:center;gap:9px;padding:6px 14px 6px 6px;border-radius:999px;flex-shrink:0;
  border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:.86rem;color:var(--ink-m);transition:.14s}
.kidc:hover{border-color:var(--gold);color:#fff}
.kidc.on{background:linear-gradient(135deg,var(--gold),var(--gold-dk));border-color:transparent;color:#2B1200}
.kidn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;
  background:rgba(0,0,0,.28);font-family:var(--cond);font-weight:800;font-size:.92rem;color:#fff}
.kidc.plus{border-style:dashed;color:var(--gold-lt);padding:6px 15px}

/* ===== player card ===== */
.card{position:relative;margin-top:18px;border-radius:22px;overflow:hidden;
  border:1px solid rgba(240,168,60,.30);
  background:linear-gradient(158deg,#3E1C72 0%,#2A1150 45%,#1B0A38 100%);
  box-shadow:0 26px 60px -30px #000}
.card-watermark{position:absolute;right:-46px;bottom:-54px;width:250px;opacity:.10;pointer-events:none}
.card-top{position:relative;display:flex;align-items:flex-start;gap:16px;padding:22px 22px 6px}
.num{font-family:var(--disp);font-size:2.5rem;line-height:.85;color:transparent;
  -webkit-text-stroke:2px rgba(240,168,60,.75);letter-spacing:-.02em;flex-shrink:0}
.nm{flex:1;min-width:0}
.nm .team{font-family:var(--cond);font-size:.82rem;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--gold-lt)}
.nm h2{font-family:var(--disp);font-size:1.75rem;line-height:1;letter-spacing:-.02em;margin-top:3px}
.nm .meta{font-size:.76rem;color:var(--ink-m);margin-top:5px}
.dial{position:relative;width:100px;height:100px;flex-shrink:0}
.dial svg{display:block;width:100%;height:100%}
.dial svg{transform:rotate(-90deg)}
.dial-val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;line-height:1;gap:2px;
  transform:translateY(-4px)}
.dial-val b{font-family:var(--disp);font-size:1.86rem;letter-spacing:-.025em;display:block;color:#fff;line-height:1}
.dial-val .dl{font-family:var(--cond);font-size:.64rem;font-weight:800;letter-spacing:.22em;
  color:var(--gold);line-height:1}
.dial-val .dd{font-family:var(--cond);font-size:.62rem;font-weight:800;font-style:normal;
  letter-spacing:.06em;color:var(--good);line-height:1}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--ink-d)}
.attrs{padding:14px 22px 22px;display:grid;gap:10px}
.at{display:grid;grid-template-columns:96px 1fr 32px;align-items:center;gap:11px}
.at-l{font-family:var(--cond);font-size:.84rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-m);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pips{display:flex;gap:3px}
.pip{flex:1;height:9px;border-radius:2px;background:rgba(255,255,255,.09)}
.pip.f{background:linear-gradient(180deg,var(--gold-lt),var(--gold))}
.pip.f.hi{background:linear-gradient(180deg,#fff,var(--gold-lt))}
.at-v{font-family:var(--disp);font-size:1rem;text-align:right}
.card-foot{border-top:1px solid var(--line-s);padding:11px 22px;font-size:.72rem;color:var(--ink-d);
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* ===== section heads ===== */
.sh{display:flex;align-items:center;gap:12px;margin:28px 2px 14px}
.sh h3{font-family:var(--disp);font-size:1.04rem;letter-spacing:.01em}
.sh .ln{flex:1;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}
.sh .ct{font-family:var(--cond);font-size:.88rem;font-weight:700;letter-spacing:.1em;color:var(--gold-lt)}

/* ===== welcome + creed ===== */
.welcome{margin-top:18px;border-radius:20px;padding:20px 22px;
  border:1px solid rgba(240,168,60,.28);
  background:linear-gradient(150deg,rgba(240,168,60,.10),rgba(139,92,214,.12)),rgba(0,0,0,.2)}
.wtitle{font-family:var(--disp);font-size:1.4rem;letter-spacing:-.01em;line-height:1.08;margin-bottom:9px}
.wbody p{color:var(--ink-s);font-size:.93rem;margin-bottom:9px}
.wbody p:last-child{margin-bottom:0}
.creed{margin-top:14px;border-radius:20px;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(150deg,rgba(240,168,60,.09),rgba(139,92,214,.09)),rgba(0,0,0,.22)}
.creed-top{padding:16px 20px 4px;font-family:var(--cond);font-size:.84rem;font-weight:700;
  letter-spacing:.26em;text-transform:uppercase;color:var(--gold-lt)}
.creed-l{display:flex;gap:16px;padding:14px 20px;border-top:1px solid var(--line-s);align-items:baseline}
.creed-l:first-of-type{border-top:none}
.creed-n{font-family:var(--disp);font-size:.78rem;color:var(--gold);width:20px;flex-shrink:0}
.creed-w{font-family:var(--disp);font-size:1.28rem;letter-spacing:-.01em;width:136px;flex-shrink:0;line-height:1.05}
.creed-t{color:var(--ink-s);font-size:.89rem;line-height:1.5}
@media(max-width:520px){.creed-l{flex-wrap:wrap;gap:6px 12px}.creed-w{width:auto}.creed-t{width:100%}}

/* ===== progress + actions ===== */
.prog{margin-top:16px;border:1px solid var(--line);border-radius:18px;padding:18px 20px;background:var(--panel)}
.prog-r{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px}
.prog-l{font-family:var(--cond);font-size:.84rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-m)}
.prog-p{font-family:var(--disp);font-size:1.7rem;line-height:1}
.bar{height:12px;border-radius:99px;background:rgba(0,0,0,.32);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold-dk),var(--gold-lt))}
.prog-s{font-size:.79rem;color:var(--ink-d);margin-top:9px;font-weight:600}
.act{display:flex;align-items:center;gap:14px;width:100%;padding:15px 17px;border-radius:16px;
  border:1px solid var(--line);background:var(--panel);margin-bottom:10px;text-align:left;transition:.15s}
.act:hover{border-color:rgba(240,168,60,.5);transform:translateX(3px);background:rgba(255,255,255,.07)}
.act-i{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;font-size:1.2rem;
  background:linear-gradient(150deg,rgba(240,168,60,.22),rgba(139,92,214,.22));border:1px solid var(--line)}
.act-m{flex:1;min-width:0}
.act-t{display:block;font-weight:800;font-size:.96rem}
.act-s{display:block;color:var(--ink-d);font-size:.78rem;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act-n{flex-shrink:0;min-width:28px;height:28px;padding:0 9px;border-radius:99px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--gold),var(--gold-dk));color:#2B1200;font-weight:900;font-size:.82rem}
.allclear{text-align:center;padding:28px 16px;border:1px dashed var(--line);border-radius:18px;margin-top:16px}
.allclear b{font-size:1.06rem}

/* ===== tiles ===== */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-top:18px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:16px;border-radius:16px;
  border:1px solid var(--line);background:var(--panel);text-align:left;transition:.15s}
.tile:hover{border-color:rgba(240,168,60,.5);transform:translateY(-2px)}
.tico{font-size:1.45rem;margin-bottom:3px}
.tlab{font-weight:800;font-size:.97rem}
.tsub{font-size:.77rem;color:var(--ink-d);font-weight:600}

/* ===== video rows ===== */
.seg{display:inline-flex;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{font-family:var(--cond);font-size:.9rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:8px 16px;border-radius:9px;color:var(--ink-m)}
.seg button.on{background:linear-gradient(135deg,var(--gold),var(--gold-dk));color:#2B1200}
.vr{display:flex;align-items:center;gap:13px;width:100%;padding:9px 13px 9px 9px;border-radius:15px;
  border:1px solid var(--line);background:var(--panel);margin-bottom:9px;text-align:left;transition:.15s}
.vr:hover{border-color:rgba(240,168,60,.5)}
.vr.done{opacity:.5}
.vt{position:relative;width:88px;height:50px;border-radius:9px;overflow:hidden;flex-shrink:0;background:#000}
.vt img{width:100%;height:100%;object-fit:cover;display:block}
.vt .ph{display:grid;place-items:center;width:100%;height:100%;font-size:1.05rem}
.vt .pl{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:.85rem;
  background:rgba(0,0,0,.22);text-shadow:0 2px 6px #000}
.vm{flex:1;min-width:0}
.vn{display:block;font-weight:700;font-size:.92rem;line-height:1.25}
.vs{display:block;color:var(--ink-d);font-size:.75rem;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vk{flex-shrink:0;font-weight:900;color:var(--gold-lt)}
.vk.ok{color:var(--good)}
.vid{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-top:11px}
.vid iframe,.vid video{position:absolute;inset:0;width:100%;height:100%;border:0}
.vidlink{display:inline-block;margin-top:10px;color:var(--gold-lt);font-weight:800;font-size:.86rem;text-decoration:none}
.vclose{width:28px;height:28px;border-radius:9px;border:1px solid var(--line);color:var(--ink-m);
  display:grid;place-items:center;flex-shrink:0}
.vclose:hover{border-color:var(--gold);color:#fff}

/* ===== notes / chips ===== */
.note{border:1px solid var(--line);border-radius:16px;padding:16px 17px;background:var(--panel);margin-bottom:11px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;padding:5px 11px;border-radius:8px;
  background:rgba(255,255,255,.06);border:1px solid var(--line-s);color:var(--ink-s);margin:3px 5px 3px 0}
.pill b{color:var(--gold-lt)}
.tag{font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(240,168,60,.11);
  border:1px solid rgba(240,168,60,.3);color:var(--gold-lt);margin:2px 4px 2px 0;display:inline-block}
.chk{width:25px;height:25px;flex-shrink:0;border-radius:8px;border:2px solid var(--line);
  display:grid;place-items:center;font-weight:900;font-size:.82rem;color:#fff}
.chk.on{background:linear-gradient(135deg,#3FBF77,#248A50);border-color:transparent}
.empty{text-align:center;padding:34px 16px;color:var(--ink-d);font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:9px}
.st{border:1px solid var(--line);border-radius:14px;padding:13px 8px;text-align:center;background:var(--panel)}
.st b{font-family:var(--disp);font-size:1.32rem;display:block;color:var(--gold-lt)}
.st span{font-family:var(--cond);font-size:.72rem;font-weight:700;letter-spacing:.14em;color:var(--ink-d);text-transform:uppercase}

/* ===== playbook ===== */
.pb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
.pb{padding:17px 16px;border-radius:16px;border:1px solid var(--line);background:var(--panel);text-align:left;transition:.15s}
.pb:hover{border-color:rgba(240,168,60,.5);transform:translateY(-2px)}
.pb-i{font-size:1.45rem;display:block;margin-bottom:6px}
.pb-t{display:block;font-weight:800;font-size:.96rem}
.pb-s{display:block;color:var(--ink-d);font-size:.76rem;margin-top:2px}
.docrow{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;border-radius:15px;
  border:1px solid var(--line);background:var(--panel);margin-bottom:10px;transition:.15s;text-align:left}
.docrow:hover{border-color:rgba(240,168,60,.5)}
.docttl{display:block;font-weight:800;font-size:1rem}
.docsum{display:block;color:var(--ink-m);font-size:.83rem;margin-top:3px}
.docgo{font-family:var(--cond);color:var(--gold-lt);font-weight:700;font-size:.86rem;letter-spacing:.08em;
  text-transform:uppercase;white-space:nowrap}
.doc{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:20px 22px;line-height:1.6}
.doc h3{font-family:var(--disp);font-size:1.06rem;color:#fff;margin:22px 0 11px;
  padding-left:12px;border-left:4px solid var(--gold)}
.doc h3:first-child{margin-top:0}
.doc h4,.doc h5{font-size:.97rem;font-weight:800;margin:16px 0 7px;color:#fff}
.doc p{margin:0 0 11px;color:var(--ink-s)}
.doc ul{margin:0 0 13px;padding-left:20px;color:var(--ink-s)}
.doc li{margin-bottom:6px}
.doc b{color:#fff}
.doc blockquote{margin:16px 0;padding:14px 17px;border-left:4px solid var(--gold);border-radius:0 12px 12px 0;
  background:rgba(240,168,60,.09);color:var(--ink-s);font-style:italic}
.defs{display:flex;flex-direction:column;gap:11px;margin:4px 0 14px}
.def{display:flex;gap:13px;align-items:flex-start}
.defn{flex-shrink:0;width:25px;height:25px;border-radius:7px;display:grid;place-items:center;
  background:rgba(240,168,60,.16);border:1px solid rgba(240,168,60,.34);color:var(--gold-lt);font-weight:900;font-size:.75rem}
.deft{font-weight:800;color:#fff;font-size:.97rem}
.defd{color:var(--ink-s);font-size:.89rem;margin-top:3px;line-height:1.45}
.back{font-family:var(--cond);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.84rem;
  color:var(--ink-m);border:1px solid var(--line);border-radius:999px;padding:8px 15px}
.back:hover{color:#fff;border-color:var(--gold)}

/* ===== messages ===== */
.msg-h{display:flex;align-items:baseline;gap:9px;margin-bottom:7px}
.msg-a{font-family:var(--cond);font-size:.94rem;font-weight:700;letter-spacing:.06em;color:var(--gold-lt)}
.msg-d{font-size:.73rem;color:var(--ink-d)}
.reply{border-left:2px solid var(--line);padding-left:12px;margin-top:11px}
.inp{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:rgba(0,0,0,.24);
  color:#fff;font-size:.9rem;font-weight:500;resize:vertical}
.inp:focus{outline:none;border-color:var(--gold);background:rgba(240,168,60,.07)}

/* ===== bottom nav ===== */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(23,7,51,.94);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:680px;margin:0 auto;display:flex}
.nb{flex:1;padding:11px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--ink-d);position:relative;transition:.14s;min-width:0}
.nb:hover{color:var(--ink-m)}
.nb.on{color:#fff}
.nb.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:26px;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,var(--gold-dk),var(--gold-lt))}
.nb-i{font-size:1.12rem;line-height:1}
.nb-l{font-family:var(--cond);font-size:.73rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.nb-b{position:absolute;top:5px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;
  background:var(--gold);color:#2B1200;font-size:.6rem;font-weight:900;display:grid;place-items:center}

/* ===== modal + toast ===== */
.ov{position:fixed;inset:0;z-index:200;background:rgba(8,3,18,.78);backdrop-filter:blur(6px);

<body>
<div id="app"><div class="empty">Loading…</div></div>
<div id="flag" class="flag">✓ Sent</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';
const SB_URL='https://vlcpgwxeybpzwidjackz.supabase.co';
const SB_KEY='sb_publishable_gtHRqI4H2q9VwyE7sG0BKA_qJSXkJMU';
const sb=createClient(SB_URL,SB_KEY);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const KEY='jag_parent_code';

const S={player:null,attrs:[],tests:[],weights:[],norms:[],results:[],snaps:[],players:[],
  drills:[],assigns:[],groups:[],members:[],comments:[],replies:[],stats:[],games:[],
  coachScores:[],settings:{},objectives:[],tasks:[],lists:[],listItems:[],itemState:[],videos:[],docs:[],welcome:[],reads:[],
  view:'home',greeted:null,filmTab:'practice',openDoc:null,openCat:null,openVid:null,
  seasons:[],sessions:[],att:[],creed:[],agoals:[],seasonId:null,shooting:[],
  household:null,kids:[]};

function flag(m){const f=$('flag');f.textContent=m||'✓ Sent';f.classList.add('show');
  clearTimeout(flag._t);flag._t=setTimeout(()=>f.classList.remove('show'),1400);}

/* A stable code derived from the player id — mirrors the coach app so codes
   work even before the pd_access table exists. An issued code always wins. */
function derivedCode(pid){
  const s=String(pid||''); let h=2166136261;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let n=Math.abs(h),o='';
  for(let i=0;i<4;i++){o+=A[n%A.length];n=Math.floor(n/A.length);}
  return 'JAG-'+o;
}

/* ---------- household helpers ---------- */
const HKEY='jag_parent_household';
async function playerIdForCode(code){
  code=String(code||'').trim().toUpperCase();
  try{
    const {data,error}=await sb.from('pd_access').select('player_id').eq('code',code).is('revoked_at',null).limit(1);
    if(!error&&data&&data.length) return data[0].player_id;
  }catch(e){}
  const {data:ps}=await sb.from('tryout_players').select('id');
  const m=(ps||[]).find(x=>derivedCode(x.id)===code);
  return m?m.id:null;
}
/* every athlete this family can see */
async function resolveKids(pid){
  const {data:mem}=await sb.from('pd_household_members').select('household_id').eq('player_id',pid).limit(1);
  let hid=mem&&mem.length?mem[0].household_id:null;
  let ids=[pid];
  if(hid){
    const {data:all}=await sb.from('pd_household_members').select('player_id').eq('household_id',hid);
    ids=[...new Set((all||[]).map(x=>x.player_id))];
    if(!ids.includes(pid))ids.push(pid);
  }
  const {data:ps}=await sb.from('tryout_players').select('*').in('id',ids);
  return {hid,kids:(ps||[]).sort((a,b)=>(a.name||'').localeCompare(b.name||''))};
}
/* link another athlete into this family */
async function addAthlete(code){
  const pid=await playerIdForCode(code);
  if(!pid) return {ok:false,msg:'That code isn\u2019t valid. Check with your coach.'};
  if(S.kids.some(k=>k.id===pid)) return {ok:false,msg:'That athlete is already on your account.'};
  let hid=S.household;
  if(!hid){
    const {data:h,error}=await sb.from('pd_households').insert({label:null}).select().single();
    if(error) return {ok:false,msg:'Could not link right now. Try again.'};
    hid=h.id;
    // bring the athlete already signed in along
    await sb.from('pd_household_members').insert({household_id:hid,player_id:S.player.id});
  }
  const {error:e2}=await sb.from('pd_household_members').insert({household_id:hid,player_id:pid});
  if(e2&&e2.code!=='23505') return {ok:false,msg:'Could not link right now. Try again.'};
  S.household=hid;
  try{localStorage.setItem(HKEY,hid);}catch(e){}
  return {ok:true,pid};
}

/* ---------- load ---------- */
async function loadFor(code){
  code=String(code||'').trim().toUpperCase();
  let pid=null;
  // 1) an explicitly issued code, if that table exists
  try{
    const {data:acc,error}=await sb.from('pd_access').select('*').eq('code',code).is('revoked_at',null).limit(1);
    if(!error&&acc&&acc.length) pid=acc[0].player_id;
  }catch(e){}
  // 2) otherwise match against the code derived from each player id
  if(!pid){
    const {data:ps}=await sb.from('tryout_players').select('id');
    const m=(ps||[]).find(x=>derivedCode(x.id)===code);
    if(m) pid=m.id;
  }
  if(!pid) return false;
  const q=(t)=>sb.from(t).select('*');
  const r=await Promise.all([
    sb.from('tryout_players').select('*').eq('id',pid).single(),
    q('pd_attributes'),q('pd_tests'),q('pd_test_weights'),q('pd_norms'),q('pd_results'),
    q('pd_snapshots'),q('tryout_players'),q('tryout_drills'),q('pd_assignments'),
    q('pd_groups'),q('pd_group_members'),q('pd_comments'),q('pd_replies'),
    q('pd_stats'),q('pd_games'),q('tryout_scores'),q('pd_settings'),
    q('pd_objectives'),q('pd_tasks'),q('pd_lists'),q('pd_list_items'),q('pd_item_state'),
    sb.from('training_videos').select('*').neq('category','fullgame'),
    sb.from('training_documents').select('*'),
    q('pd_welcome'),q('pd_message_reads'),
    q('pd_seasons'),q('pd_sessions'),q('pd_attendance'),q('pd_creed'),q('pd_athlete_goals'),q('pd_shooting')]);
  S.player=r[0].data;
  S.attrs=r[1].data||[];S.tests=r[2].data||[];S.weights=r[3].data||[];S.norms=r[4].data||[];
  S.results=r[5].data||[];S.snaps=r[6].data||[];S.players=r[7].data||[];S.drills=r[8].data||[];
  S.assigns=r[9].data||[];S.groups=r[10].data||[];S.members=r[11].data||[];
  S.comments=r[12].data||[];S.replies=r[13].data||[];S.stats=r[14].data||[];S.games=r[15].data||[];
  S.coachScores=r[16].data||[];
  const set={};(r[17].data||[]).forEach(x=>set[x.key]=x.value);S.settings=set;
  S.seasons=(r[27]&&r[27].data)||[];S.sessions=(r[28]&&r[28].data)||[];S.att=(r[29]&&r[29].data)||[];
  S.creed=(r[30]&&r[30].data)||[];S.agoals=(r[31]&&r[31].data)||[];S.shooting=(r[32]&&r[32].data)||[];
  const _as=S.seasons.find(x=>x.is_active); S.seasonId=_as?_as.id:(S.seasons[0]?S.seasons[0].id:null);
  const fam=await resolveKids(pid);
  S.household=fam.hid; S.kids=fam.kids.length?fam.kids:[S.player];
  if(fam.hid){try{localStorage.setItem(HKEY,fam.hid);}catch(e){}}
  S.objectives=r[18].data||[];S.tasks=r[19].data||[];S.lists=r[20].data||[];S.listItems=r[21].data||[];S.itemState=r[22].data||[];
  S.videos=r[23].data||[];S.docs=r[24].data||[];S.welcome=r[25].data||[];S.reads=r[26].data||[];
  return !!S.player;
}

/* ---------- rating engine (mirrors the coach app) ---------- */
const SC=()=>Object.assign({mid:70,spread:10,floor:35,cap:99,k:10},S.settings.scale||{});
const activeAttrs=()=>S.attrs.filter(a=>a.is_active!==false).sort((a,b)=>(a.sort_idx??0)-(b.sort_idx??0));
const activeTests=()=>S.tests.filter(t=>t.is_active!==false).sort((a,b)=>(a.sort_idx??0)-(b.sort_idx??0));
/* ratings compare an athlete against peers — either their school grade or their team */
function cohortMode(){return (S.settings&&S.settings.cohort)||'grade';}
function teamsOf(pid){return S.members.filter(m=>m.player_id===pid).map(m=>m.group_id);}
function cohortPeers(player){
  if(!player)return [];
  if(cohortMode()==='team'){
    const t=teamsOf(player.id);
    if(t.length) return S.players.filter(x=>teamsOf(x.id).some(g=>t.includes(g)));
    return [];   // no team set -> fall through to the program baseline
  }
  return S.players.filter(x=>x.grade===player.grade);
}
function cohortName(player){
  if(cohortMode()==='team'){
    const t=teamsOf(player.id).map(id=>(S.groups.find(g=>g.id===id)||{}).name).filter(Boolean);
    return t.length?t.join(' / '):'no team';
  }
  return 'grade '+(player.grade==null?'–':player.grade);
}
function latestResult(pid,tk){const rs=S.results.filter(r=>r.player_id===pid&&r.test_key===tk)
  .sort((a,b)=>String(b.tested_at).localeCompare(String(a.tested_at)));return rs.length?rs[0]:null;}
function priorResult(pid,tk){const rs=S.results.filter(r=>r.player_id===pid&&r.test_key===tk)
  .sort((a,b)=>String(b.tested_at).localeCompare(String(a.tested_at)));return rs.length>1?rs[1]:null;}
function stats(vals){if(!vals.length)return{n:0,mean:0,sd:0};
  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  const sd=vals.length>1?Math.sqrt(vals.reduce((s,v)=>s+(v-mean)**2,0)/(vals.length-1)):0;
  return{n:vals.length,mean,sd};}
const cohort=(tk,player)=>stats(cohortPeers(player).map(p=>latestResult(p.id,tk)).filter(Boolean).map(r=>+r.value));
const poolStats=tk=>stats(S.players.map(p=>latestResult(p.id,tk)).filter(Boolean).map(r=>+r.value));
function testRating(tk,player,value){
  const t=S.tests.find(x=>x.key===tk); if(!t||value==null||isNaN(value))return null;
  const sc=SC(), flip=t.lower_is_better?-1:1;
  const c=cohort(tk,player), pool=poolStats(tk);
  const nm=S.norms.find(n=>n.test_key===tk&&+n.grade===+(player&&player.grade));
  let zBase=0;
  if(nm&&+nm.sd>0) zBase=((value-+nm.mean)/+nm.sd)*flip;
  else if(pool.n>2&&pool.sd>0) zBase=((value-pool.mean)/pool.sd)*flip;
  const zGrade=(c.n>3&&c.sd>0)?((value-c.mean)/c.sd)*flip:null;
  const k=+sc.k||10,n=c.n;
  const z=zGrade==null?zBase:zGrade*(n/(n+k))+zBase*(k/(n+k));
  return Math.max(sc.floor,Math.min(sc.cap,Math.round(sc.mid+sc.spread*z)));
}
const coachTo100=s=>Math.round(40+(s-1)*(60/9));
function coachAvg(pid,k){const v=S.coachScores.filter(s=>s.player_id===pid&&s.category===k).map(s=>+s.value);
  return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}
function attrRating(pid,key){
  const p=S.player,a=S.attrs.find(x=>x.key===key); if(!p||!a)return{rating:null};
  if(key==='shooting'){ const sh=shootingFor(pid); if(sh&&sh.ovr!=null) return {rating:sh.ovr}; }
  let num=0,den=0;
  S.weights.filter(w=>w.attribute_key===key).forEach(w=>{
    const r=latestResult(pid,w.test_key); if(!r)return;
    const rt=testRating(w.test_key,p,+r.value); if(rt==null)return;
    num+=rt*+w.weight; den+=+w.weight;});
  const cw=+a.coach_weight||0;
  if(cw>0){const cs=coachAvg(pid,key); if(cs!=null){num+=coachTo100(cs)*cw; den+=cw;}}
  return den>0?{rating:Math.round(num/den)}:{rating:null};
}
function ovrOf(pid){
  const rt={};let num=0,den=0;
  activeAttrs().forEach(a=>{const r=attrRating(pid,a.key);rt[a.key]=r;
    if(r.rating!=null){num+=r.rating*(+a.weight||1);den+=(+a.weight||1);}});
  return{ovr:den>0?Math.round(num/den):null,ratings:rt};
}
function lastSnap(pid){const s=S.snaps.filter(x=>x.player_id===pid)
  .sort((a,b)=>String(b.as_of).localeCompare(String(a.as_of)));return s.length?s[0]:null;}
function deltaFor(pid,key,cur){const s=lastSnap(pid);if(!s||cur==null)return null;

function ratingColor(v){if(v==null)return 'rgba(255,255,255,.2)';

/* NOTE: don't use upsert here. pd_item_state's video_id uniqueness is a *partial*
   index, which PostgREST can't target with on_conflict (returns 400), so the write
   silently failed while the UI showed it watched. Find-then-insert/update instead. */
async function markWatched(mid){
  if(!S.player||!mid||hasWatchedMid(mid))return;
  const [k,id]=String(mid).split(':');
  const row={player_id:S.player.id,status:'watched',completed_at:new Date().toISOString()};
  if(k==='v')row.video_id=id; else row.drill_id=id;
  let q=sb.from('pd_item_state').select('id').eq('player_id',S.player.id);
  q = k==='v' ? q.eq('video_id',id) : q.eq('drill_id',id);
  const {data:ex}=await q.limit(1);
  let saved=null;
  if(ex&&ex.length){
    const {error}=await sb.from('pd_item_state').update(row).eq('id',ex[0].id);
    if(error){console.error('watch update failed',error);return;}
    saved=Object.assign({id:ex[0].id},row);
  }else{
    const {data,error}=await sb.from('pd_item_state').insert(row).select().single();
    if(error){console.error('watch insert failed',error);return;}
    saved=data||row;
  }
  S.itemState.push(saved);
  renderPortal(); flag('✓ Marked watched');
}

/* ---- height / wingspan: always feet and inches ---- */
/* accepts 5-4, 5'4", 5' 4", 64in, 64", or a bare number, and normalises it */
function parseHW(raw){
  if(raw==null)return null;
  const t=String(raw).trim(); if(!t)return null;
  /* inches-only first, otherwise 48in reads as 48 feet */
  let m=t.match(/^(\d{1,3}(?:\.\d+)?)\s*(?:"|in\b|inch|inches)$/i);
  if(m) return inchesToHW(+m[1]);
  m=t.match(/^(\d{1,2})\s*(?:'|ft\b|feet|-|\s)\s*(\d{1,2}(?:\.\d+)?)?\s*(?:"|in\b|inch|inches)?$/i);
  if(m){
    const ft=+m[1], inch=m[2]==null?0:+m[2];
    if(ft<=8 && inch<12) return {ft:ft,inch:inch};
  }
  m=t.match(/^(\d{1,3}(?:\.\d+)?)$/);
  if(m){ const n=+m[1]; return n>=12 ? inchesToHW(n) : {ft:Math.floor(n),inch:Math.round((n%1)*12)}; }
  return null;
}
function inchesToHW(n){ return {ft:Math.floor(n/12), inch:Math.round(n%12)}; }
function fmtHW(raw){
  const h=parseHW(raw); if(!h)return raw==null?null:String(raw);
  return h.ft+String.fromCharCode(39)+h.inch+String.fromCharCode(34);
}

/* ================= OPEN SHOOTING — Jaguars benchmarks ================= */
/* Percentage that earns each rating row (50,60,70,80,90) by category. Grades 3 and 7 are the
   anchor grades from the benchmark doc; every other grade interpolates between them. */
const SHOOT_ROWS=[50,60,70,80,90];
const SHOOT_ANCHORS={
  3:{ft:[30,40,50,60,70], mid:[25,35,45,55,65], long:[15,25,35,45,55]},
  7:{ft:[45,55,65,75,85], mid:[35,45,55,65,75], long:[20,28,35,42,50]}
};
const SHOOT_WEIGHTS={3:{ft:0.35,mid:0.45,long:0.20}, 7:{ft:0.30,mid:0.35,long:0.35}};
const SHOOT_PROTOCOL={3:{ft:20,mid:40,long:30}, 7:{ft:25,mid:50,long:50}};
const SHOOT_CATS=[['ft','Free throw'],['mid','Mid-range'],['long','3-point']];
const SHOOT_SPOTS=['L corner','L wing','Top','R wing','R corner'];
function shootT(grade){ const g=grade==null?7:+grade; return Math.max(0,Math.min(1,(g-3)/4)); }
function shootYoung(grade){ return shootT(grade)<0.5; }
function shootLabel(cat,grade){
  if(cat==='long') return shootYoung(grade)?'Long-range form':'3-point';
  if(cat==='mid')  return shootYoung(grade)?'Close / mid set shot':'Mid-range';
  return shootYoung(grade)?'Form free throw':'Free throw';
}
function shootAnchors(cat,grade){
  const t=shootT(grade), a=SHOOT_ANCHORS[3][cat], b=SHOOT_ANCHORS[7][cat];
  return a.map(function(v,i){return v+(b[i]-v)*t;});
}
function shootWeights(grade){
  const t=shootT(grade), a=SHOOT_WEIGHTS[3], b=SHOOT_WEIGHTS[7];
  return {ft:a.ft+(b.ft-a.ft)*t, mid:a.mid+(b.mid-a.mid)*t, long:a.long+(b.long-a.long)*t};
}
function shootProtocol(cat,grade){
  const t=shootT(grade);
  return Math.round(SHOOT_PROTOCOL[3][cat]+(SHOOT_PROTOCOL[7][cat]-SHOOT_PROTOCOL[3][cat])*t);
}
function shootScale(){ return (typeof SC==='function')?SC():{floor:35,cap:99}; }
/* percentage -> rating: straight lines between the anchor rows, extended past both ends */
function shootRate(pct,cat,grade){
  if(pct==null||isNaN(pct))return null;
  const P=shootAnchors(cat,grade), R=SHOOT_ROWS, sc=shootScale();
  let r, n=P.length-1;
  if(pct<=P[0]){ r=R[0]-(P[0]-pct)*((R[1]-R[0])/(P[1]-P[0])); }
  else if(pct>=P[n]){ r=R[n]+(pct-P[n])*((R[n]-R[n-1])/(P[n]-P[n-1])); }
  else { for(let i=0;i<n;i++){ if(pct>=P[i]&&pct<=P[i+1]){ r=R[i]+(pct-P[i])/(P[i+1]-P[i])*(R[i+1]-R[i]); break; } } }
  return Math.max(sc.floor,Math.min(sc.cap,Math.round(r)));
}
/* the percentage worth a 60 — no spot may sit under it if the category is to rate above 80 */
function shootFloor60(cat,grade){ return shootAnchors(cat,grade)[1]; }
/* one test day, one category */
function shootDay(row,grade){
  const a=+row.attempts||0, m=+row.makes||0;
  if(!a) return null;
  const pct=100*m/a;
  const raw=shootRate(pct,row.category,grade);
  const need=shootProtocol(row.category,grade);
  const conf=Math.min(1,a/need);
  let rating=Math.round(50+(raw-50)*conf);
  let capped=false, weakSpots=[];
  if((row.category==='mid'||row.category==='long')&&Array.isArray(row.spots)&&row.spots.length){
    const f=shootFloor60(row.category,grade);
    row.spots.forEach(function(s,i){ const sa=+s.a||0; if(sa>0&&100*(+s.m||0)/sa<f) weakSpots.push(SHOOT_SPOTS[i]||('Spot '+(i+1))); });
    if(weakSpots.length&&rating>80){rating=80;capped=true;}
  }
  return {pct:Math.round(pct*10)/10,makes:m,attempts:a,raw:raw,rating:rating,conf:conf,need:need,capped:capped,weakSpots:weakSpots,when:row.taken_on};
}
/* a player's official shooting: the latest two test days per category, averaged */
function shootingFor(pid){
  const p=(S.players||[]).find(function(x){return x.id===pid;})||(S.player&&S.player.id===pid?S.player:null);
  if(!p) return null;
  const grade=p.grade;
  const rows=(S.shooting||[]).filter(function(r){return r.player_id===pid&&inSeason(r)&&r.source!=='game';});
  if(!rows.length) return null;
  const out={grade:grade,young:shootYoung(grade),weights:shootWeights(grade),cats:{},have:0};
  let num=0,den=0;
  SHOOT_CATS.forEach(function(c){ const cat=c[0];
    const days=rows.filter(function(r){return r.category===cat;})
      .sort(function(a,b){return String(b.taken_on).localeCompare(String(a.taken_on));});
    const rated=days.map(function(r){return shootDay(r,grade);}).filter(Boolean).slice(0,2);
    if(!rated.length){out.cats[cat]=null;return;}
    const rating=Math.round(rated.reduce(function(s,d){return s+d.rating;},0)/rated.length);
    const pct=Math.round(rated.reduce(function(s,d){return s+d.pct;},0)/rated.length*10)/10;
    out.cats[cat]={rating:rating,pct:pct,days:rated.length,
      attempts:rated.reduce(function(s,d){return s+d.attempts;},0),
      need:rated[0].need, provisional:rated.some(function(d){return d.conf<1;}),
      capped:rated.some(function(d){return d.capped;}), label:shootLabel(cat,grade), latest:rated[0]};
    num+=rating*out.weights[cat]; den+=out.weights[cat]; out.have++;
  });
  out.ovr=den>0?Math.round(num/den):null;
  return out;
}

/* ---- shooting shown as three lines when the test exists ---- */
const SHOOT_SUBKEYS={ft:'shoot_ft',mid:'shoot_mid',long:'shoot_long'};
function shootSubRatings(pid){
  const sh=shootingFor(pid); if(!sh)return null;
  const o={};
  SHOOT_CATS.forEach(function(c){ const x=sh.cats[c[0]]; if(x) o[SHOOT_SUBKEYS[c[0]]]={rating:x.rating,label:x.label,cat:c[0],pct:x.pct,attempts:x.attempts,provisional:x.provisional,capped:x.capped}; });
  return Object.keys(o).length?o:null;
}
/* the attribute list for display: the shooting row splits into its tests when they exist */
function displayAttrs(pid,attrs){
  const subs=shootSubRatings(pid), out=[];
  (attrs||activeAttrs()).forEach(function(a){
    if(a.key==='shooting'&&subs){ Object.keys(subs).forEach(function(k){ out.push({key:k,label:subs[k].label,weight:a.weight,sub:subs[k],parent:'shooting'}); }); }
    else out.push({key:a.key,label:a.label,weight:a.weight});
  });
  return out;
}
/* rating for any display key — a real attribute or one of the shooting sub-keys */
function ratingOfKey(pid,key,ratings){
  if(key.indexOf('shoot_')===0){ const subs=shootSubRatings(pid); return subs&&subs[key]?subs[key].rating:null; }
  const r=ratings?ratings[key]:null; return r&&r.rating!=null?r.rating:null;
}
/* what a checkpoint should remember, so growth and compare can read the split later */
function snapshotAttrs(pid,ratings){
  const aj={}; Object.keys(ratings).forEach(function(k){ if(ratings[k].rating!=null) aj[k]=ratings[k].rating; });
  const subs=shootSubRatings(pid); if(subs) Object.keys(subs).forEach(function(k){ aj[k]=subs[k].rating; });
  return aj;
}

/* ---------- season / attendance / creed / athlete goals ---------- */
const seasonName=id=>{const x=S.seasons.find(y=>y.id===id);return x?x.name:'Earlier';};
const curSeasonName=()=>{const x=S.seasons.find(y=>y.id===S.seasonId);return x?x.name:'This season';};
const inSeason=r=>!S.seasonId||r.season_id==null||r.season_id===S.seasonId;
function mySessions(){
  const t=teamsOf(S.player.id);
  return S.sessions.filter(inSeason)
    .filter(x=>!x.group_id||t.includes(x.group_id))
    .sort((a,b)=>String(b.session_date).localeCompare(String(a.session_date)));
}
function myAttendance(){
  const ids=new Set(mySessions().map(x=>x.id));
  const rows=S.att.filter(a=>a.player_id===S.player.id&&ids.has(a.session_id));
  const held=rows.length, here=rows.filter(a=>a.status==='present'||a.status==='late').length;
  let streak=0;
  for(const sx of mySessions()){
    const a=rows.find(r=>r.session_id===sx.id); if(!a)break;
    if(a.status==='present'||a.status==='late')streak++; else break;
  }
  const eff=rows.filter(a=>a.effort===3).length;
  return {held,here,streak,greatEffort:eff,pct:held?Math.round(here/held*100):null};
}
const CREED_P=[['force_v','FORCE'],['intentional_v','INTENTIONAL'],['compete_v','COMPETE'],['deliberate_v','DELIBERATE']];
function myCreed(){
  const ids=new Set(mySessions().map(x=>x.id));
  const rows=S.creed.filter(c=>c.player_id===S.player.id&&ids.has(c.session_id));
  if(!rows.length)return null;
  const out={n:rows.length};
  CREED_P.forEach(c=>{const v=rows.map(r=>r[c[0]]).filter(x=>x!=null);
    out[c[0]]=v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10:null;});
  return out;
}
function myGoals(){return S.agoals.filter(g=>g.player_id===S.player.id)
  .sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));}
const AGL={proposed:'Waiting for a parent to sign',parent_signed:'Waiting for coach approval',
  approved:'Approved — go get it',complete:'Done',declined:'Not this time'};
function agoalPct(g){
  if(!g.test_key||g.target_value==null)return null;
  const rs=S.results.filter(r=>r.player_id===g.player_id&&r.test_key===g.test_key)
    .sort((a,b)=>String(b.measured_on||'').localeCompare(String(a.measured_on||'')));
  if(!rs.length)return null;
  const start=g.start_value==null?0:+g.start_value, tgt=+g.target_value, cur=+rs[0].value;
  if(tgt===start)return null;
  return Math.max(0,Math.min(100,Math.round((cur-start)/(tgt-start)*100)));
}
/* growth across seasons, newest last */
function growthPoints(){
  const pts=S.snaps.filter(x=>x.player_id===S.player.id)
    .sort((a,b)=>String(a.as_of).localeCompare(String(b.as_of)))
    .map(x=>({when:String(x.as_of).slice(5),label:seasonName(x.season_id),ovr:x.ovr}));
  const now=ovrOf(S.player.id).ovr;
  if(now!=null)pts.push({when:'now',label:curSeasonName(),ovr:now});
  return pts;
}
function growthBlock(){
  const pts=growthPoints();
  if(pts.length<2)return '';
  const d=pts[pts.length-1].ovr-pts[0].ovr;
  const min=Math.min.apply(null,pts.map(p=>p.ovr))-4, max=Math.max.apply(null,pts.map(p=>p.ovr))+4;
  const W=480,H=96,span=Math.max(1,max-min);
  const P=pts.map((p,i)=>[10+i*((W-20)/Math.max(1,pts.length-1)),H-8-((p.ovr-min)/span)*(H-20)]);
  const line=P.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return '<div class="sec"><h3>How far you have come</h3>'+
    '<div class="grow">'+
      '<div class="growtop"><b>'+(d>0?'+'+d:d)+'</b><span>overall since '+esc(pts[0].label)+'</span></div>'+
      '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" class="growsvg">'+
        '<polygon points="10,'+(H-8)+' '+line+' '+(W-10)+','+(H-8)+'" fill="rgba(240,168,60,.16)"/>'+
        '<polyline points="'+line+'" fill="none" stroke="#F0A83C" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>'+
        P.map((p,i)=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(i===P.length-1?5:3.5)+'" fill="#F0A83C"/>').join('')+
      '</svg>'+
      '<div class="growx">'+pts.map(p=>'<span><b>'+p.ovr+'</b>'+esc(p.when)+'</span>').join('')+'</div>'+
    '</div></div>';
}

/* ---------- HOME: welcome + creed + progress + what needs doing ---------- */
function welcomeFor(p){
  if(!p)return null;
  const gids=S.members.filter(m=>m.player_id===p.id).map(m=>m.group_id);
  const byGroup=S.welcome.find(w=>w.scope==='group'&&gids.includes(w.scope_value));
  if(byGroup)return byGroup;
  const byGrade=S.welcome.find(w=>w.scope==='grade'&&+w.scope_value===+p.grade);
  if(byGrade)return byGrade;
  return S.welcome.find(w=>w.scope==='all')||null;
}
const isRead=cid=>S.reads.some(r=>r.comment_id===cid&&r.player_id===S.player.id);
async function markAllRead(msgs){
  const unread=msgs.filter(c=>!isRead(c.id));
  if(!unread.length)return;
  const rows=unread.map(c=>({comment_id:c.id,player_id:S.player.id}));
  const {data,error}=await sb.from('pd_message_reads').insert(rows).select();
  if(error){console.error('mark read failed',error);return;}
  (data||rows).forEach(r=>S.reads.push(r));
  renderPortal();
}
function tile(goto,icon,label,sub){
  return '<button class="tile" data-goto="'+goto+'"><span class="tico">'+icon+'</span>'+
    '<span class="tlab">'+label+'</span><span class="tsub">'+esc(sub)+'</span></button>';
}
function videoTileSub(total,unseenN){
  if(!total)return 'None yet';
  if(!unseenN)return '✓ All watched';
  return unseenN+' to watch';
}
function secHome(p,ovr,objs,tks,objDone,tkDone,media,msgs,practiceAll,breakAll,newPractice,newBreak){
  const w=welcomeFor(p);
  const vals=(S.settings&&S.settings.values)||null;
  const openTasks=tks.filter(t=>!taskDone(t));
  const unwatched=media.filter(m=>!hasWatchedMid(m.mid));
  const unread=msgs.filter(c=>!isRead(c.id));
  const openObjs=objs.filter(o=>!o.done);
  const doneN=tkDone+(media.length-unwatched.length), totalN=tks.length+media.length;
  const pct=totalN?Math.round(100*doneN/totalN):0;

  const acts=[];
  if(openTasks.length)acts.push(['work','🎯',openTasks.length+' to-do'+(openTasks.length===1?'':'s')+' to finish',
    openTasks.slice(0,2).map(t=>t.title).join(' · '),openTasks.length]);
  if(unwatched.length)acts.push([unwatched[0].cat==='gamebreakdown'?'film':'film','🎬',
    unwatched.length+' video'+(unwatched.length===1?'':'s')+' to watch',
    unwatched.slice(0,2).map(m=>m.name).join(' · '),unwatched.length]);
  if(unread.length)acts.push(['coach','💬',unread.length+' new message'+(unread.length===1?'':'s'),
    unread.slice(0,1).map(c=>(c.author_name||'Coach')+': '+String(c.body||'').slice(0,58)).join(''),unread.length]);
  if(openObjs.length)acts.push(['work','🏅',openObjs.length+' objective'+(openObjs.length===1?'':'s')+' in progress',
    'Your coach checks these off',openObjs.length]);

  return idCard(p)+
    (w?'<button class="wopen" data-openwelcome="1">📣 '+esc(w.title||'A message from your coach')+'</button>':'')+
    ((vals&&vals.items&&vals.items.length)?'<div class="creed">'+
      '<div class="creed-top">'+esc(vals.title||'This Is Who We Are')+'</div>'+
      vals.items.map((x,i)=>'<div class="creed-l"><span class="creed-n">0'+(i+1)+'</span>'+
        '<span class="creed-w">'+esc(x.word)+'</span><span class="creed-t">'+esc(x.text)+'</span></div>').join('')+
    '</div>':'')+
    '<div class="prog"><div class="prog-r"><span class="prog-l">Follow-up progress</span>'+
      '<b class="prog-p" style="color:'+(!totalN?'var(--ink-d)':pct===100?'var(--good)':'var(--gold-lt)')+'">'+pct+'%</b></div>'+
      '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
      '<div class="prog-s">'+(totalN?doneN+' of '+totalN+' things done':'Nothing assigned yet')+'</div></div>'+
    (acts.length
      ? '<div class="sh"><h3>NEEDS ATTENTION</h3><div class="ln"></div></div>'+
        acts.map(a=>'<button class="act" data-goto="'+a[0]+'"><span class="act-i">'+a[1]+'</span>'+
          '<span class="act-m"><span class="act-t">'+esc(a[2])+'</span><span class="act-s">'+esc(a[3])+'</span></span>'+
          '<span class="act-n">'+a[4]+'</span></button>').join('')
      : '<div class="allclear"><div style="font-size:2rem">✅</div><b>All caught up</b>'+
        '<div style="color:var(--ink-m);font-size:.88rem;margin-top:4px">Nothing outstanding right now.</div></div>')+
    '<div class="tiles">'+
      tile('stats','📊','Stats',ovr==null?'No rating yet':'OVR '+ovr)+
      tile('work','🎯','My Work',(objs.length+tks.length)?((objDone+tkDone)+'/'+(objs.length+tks.length)+' done'):'Nothing yet')+
      tile('film','🎬','Film',videoTileSub(practiceAll.length+breakAll.length,newPractice+newBreak))+
      tile('book','📘','Playbook',S.docs.length+' pages')+
    '</div>';
}

/* ---------- STATS: the card lives here, not on home ---------- */
function secStats(p,ovr,ratings){
  const gains=[];
  activeTests().forEach(t=>{const cur=latestResult(p.id,t.key),pr=priorResult(p.id,t.key);
    if(cur&&pr&&+cur.value!==+pr.value){const d=+cur.value-+pr.value;
      gains.push({t,from:+pr.value,to:+cur.value,better:t.lower_is_better?d<0:d>0});}});
  const ln=S.stats.filter(x=>x.player_id===p.id);
  const g=ln.length, sum=k=>ln.reduce((a,b)=>a+(+b[k]||0),0);
  const f=x=>(Math.round(x*10)/10).toFixed(1);
  return heroCard(p,ovr,ratings)+
    secShooting(p)+
    growthBlock()+
    secEffort()+
    (gains.length?'<div class="sh"><h3>IMPROVEMENT</h3><div class="ln"></div></div>'+
      '<div class="note">'+gains.map(x=>'<span class="pill">'+esc(x.t.label)+
        ' <b style="color:'+(x.better?'var(--good)':'var(--bad)')+'">'+x.from+' → '+x.to+'</b></span>').join('')+'</div>':'')+
    (g?'<div class="sh"><h3>SEASON</h3><div class="ln"></div></div>'+
      '<div class="stats">'+
        '<div class="st"><b>'+g+'</b><span>GP</span></div>'+
        '<div class="st"><b>'+f(sum('pts')/g)+'</b><span>PPG</span></div>'+
        '<div class="st"><b>'+f((sum('oreb')+sum('dreb'))/g)+'</b><span>RPG</span></div>'+
        '<div class="st"><b>'+f(sum('ast')/g)+'</b><span>APG</span></div>'+
        '<div class="st"><b>'+f(sum('stl')/g)+'</b><span>SPG</span></div>'+
        '<div class="st"><b>'+(sum('fga')?f(100*sum('fgm')/sum('fga'))+'%':'–')+'</b><span>FG</span></div>'+
      '</div>'
     :'<div class="sh"><h3>SEASON</h3><div class="ln"></div></div><div class="empty">No games logged yet.</div>');
}

    '<input class="codein" id="akcode" placeholder="JAG-••••" maxlength="8" autocomplete="off">'+
    '<div class="err" id="akerr"></div>'+
    '<button class="btn btn-p btn-block" id="akgo">Add athlete</button>'+
    '</div></div>';
  document.body.appendChild(host);
  const close=()=>host.remove();
  host.onclick=e=>{if(e.target===host)close();};
  host.querySelector('#ax').onclick=close;
  const go=async()=>{
    const c=host.querySelector('#akcode').value.trim();
    if(!c)return;
    host.querySelector('#akerr').textContent='Checking…';
    const res=await addAthlete(c);
    if(!res.ok){host.querySelector('#akerr').textContent=res.msg;return;}
    close();
    const code=await codeForPlayer(res.pid);
    await loadFor(code); S.view='home'; renderPortal(); flag('Athlete added');
  };
  host.querySelector('#akgo').onclick=go;
  const inp=host.querySelector('#akcode');
  inp.onkeydown=e=>{if(e.key==='Enter')go();};
  inp.focus();
}

/* ---------- auto watch detection ---------- */
function attachWatchDetection(){
  // native video: mark at 90% watched
  document.querySelectorAll('video[data-vid]').forEach(v=>{
    if(v._wired)return; v._wired=true;
    v.addEventListener('timeupdate',()=>{
      if(v.duration&&v.currentTime/v.duration>=0.9) markWatched(v.dataset.vid);
    });
  });
  // youtube: poll the iframe player through the IFrame API
  const frames=[...document.querySelectorAll('iframe[data-yt]')].filter(f=>!f._wired);
  if(!frames.length)return;
  const boot=()=>frames.forEach(f=>{
    f._wired=true;
    try{
      const pl=new YT.Player(f.id,{events:{onStateChange:e=>{
        if(e.data===YT.PlayerState.ENDED) markWatched(f.dataset.yt);
        if(e.data===YT.PlayerState.PLAYING){
          clearInterval(f._t);
          f._t=setInterval(()=>{
            try{const d=pl.getDuration(),c=pl.getCurrentTime();
              if(d&&c/d>=0.9){clearInterval(f._t);markWatched(f.dataset.yt);}
            }catch(err){clearInterval(f._t);}
          },2000);
        } else clearInterval(f._t);
      }}});
    }catch(err){}
  });
  if(window.YT&&window.YT.Player){boot();return;}
  if(!window._ytLoading){
    window._ytLoading=true;
    const t=document.createElement('script'); t.src='https://www.youtube.com/iframe_api';
    document.head.appendChild(t);
  }
  const prev=window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady=()=>{ if(prev)try{prev()}catch(e){} boot(); };
}

/* ---------- boot ---------- */
(async()=>{
  let saved=null; try{saved=localStorage.getItem(KEY);}catch(e){}
  if(saved){ const ok=await loadFor(saved); if(ok){renderPortal();return;} }
  renderGate();
})();
</script>
