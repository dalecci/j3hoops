<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0A0612"/>
<title>Jaguars · Athlete Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0612; --card:#140B20; --card2:#251539; --head:#1a1030;
    --pur:#8B43E0; --pur-br:#A66BF2; --pur-dp:#5B21B6; --pur-soft:rgba(139,67,224,.12);
    --gold:#E3AE33; --gold-br:#F4C84B;
    --tx:#fff; --tx-s:rgba(255,255,255,.78); --tx-m:rgba(255,255,255,.55); --tx-d:rgba(255,255,255,.32);
    --line:rgba(255,255,255,.10); --line-s:rgba(255,255,255,.055);
    --disp:'Anton',system-ui,sans-serif; --sans:'Inter',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{font-family:var(--sans);color:var(--tx);line-height:1.5;min-height:100vh;overflow-x:hidden;
    background:radial-gradient(1100px 650px at 80% -10%,rgba(139,67,224,.20),transparent 60%),
               radial-gradient(800px 550px at -10% 10%,rgba(227,174,51,.08),transparent 55%),var(--bg);
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit}
  .wrap{max-width:680px;margin:0 auto;padding:18px 16px 70px}

  .bar{position:sticky;top:0;z-index:60;background:rgba(10,6,18,.85);backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  .bar-in{max-width:680px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:11px}
  .badge{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--pur),var(--pur-dp))}
  .bname b{font-family:var(--disp);font-size:1rem;letter-spacing:.05em;display:block;line-height:1}
  .bname span{font-size:.68rem;color:var(--gold-br)}
  .out{margin-left:auto;font-size:.7rem;font-weight:800;color:var(--tx-m);text-transform:uppercase;letter-spacing:.08em}
  .out:hover{color:var(--pur-br)}

  /* gate */
  .gate{min-height:88vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .gate-in{width:100%;max-width:400px;text-align:center}
  .gbadge{width:76px;height:76px;border-radius:21px;margin:0 auto 18px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--pur),var(--pur-dp));box-shadow:0 18px 40px -16px var(--pur)}
  .gate-in h1{font-family:var(--disp);font-size:2.3rem;line-height:.98;letter-spacing:.02em}
  .kick{font-size:.68rem;font-weight:900;letter-spacing:.26em;color:var(--gold-br);text-transform:uppercase}
  .gate-in p{color:var(--tx-m);margin:9px 0 22px;font-size:.92rem}
  .codein{width:100%;padding:16px;border-radius:13px;border:1px solid var(--line);background:var(--card);
    color:#fff;font-size:1.35rem;font-weight:800;text-align:center;letter-spacing:.12em;text-transform:uppercase;
    font-family:var(--disp)}
  .codein:focus{outline:none;border-color:var(--pur);background:var(--pur-soft)}
  .err{color:#ff8080;font-size:.85rem;font-weight:700;min-height:20px;margin-top:9px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;border-radius:11px;
    font-weight:800;font-size:.88rem;transition:.15s}
  .btn-p{background:linear-gradient(135deg,var(--pur),var(--pur-dp));color:#fff;box-shadow:0 10px 22px -10px var(--pur)}
  .btn-p:hover{filter:brightness(1.08)}
  .btn-g{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--tx-s)}
  .btn-g:hover{border-color:var(--pur);color:var(--pur-br)}
  .btn-block{width:100%}
  .btn-s{padding:8px 13px;font-size:.78rem;border-radius:9px}

  /* hero card */
  .hero{border-radius:20px;overflow:hidden;border:1px solid var(--line);margin-bottom:16px;
    background:linear-gradient(160deg,#22133a,#0f0919);position:relative}
  .hero.elite{border-color:rgba(244,200,75,.5);background:linear-gradient(160deg,#2e2114,#120c1c)}
  .hero-top{display:flex;align-items:center;gap:14px;padding:20px 20px 14px}
  .jersey{width:62px;height:62px;border-radius:15px;flex-shrink:0;display:grid;place-items:center;
    font-family:var(--disp);font-size:1.8rem;background:var(--card2);border:1px solid var(--line)}
  .pname{font-family:var(--disp);font-size:1.7rem;line-height:1;letter-spacing:.02em}
  .pmeta{font-size:.76rem;color:var(--tx-d);font-weight:600;margin-top:4px}
  .ovrbox{margin-left:auto;text-align:center;line-height:1}
  .ovrbox b{font-family:var(--disp);font-size:3.1rem;display:block}
  .ovrbox span{font-size:.6rem;font-weight:900;letter-spacing:.18em;color:var(--tx-d)}
  .bars{padding:2px 20px 20px;display:grid;gap:9px}
  .brow{display:grid;grid-template-columns:92px 1fr 40px;align-items:center;gap:10px}
  .blab{font-size:.7rem;font-weight:700;color:var(--tx-m);text-transform:uppercase;letter-spacing:.04em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btrack{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
  .bfill{height:100%;border-radius:99px;transition:width .6s ease}
  .bval{font-family:var(--disp);font-size:1.05rem;text-align:right}
  .delta{font-size:.64rem;font-weight:800;margin-left:3px}
  .up{color:#5ee6a0}.down{color:#ff8080}.flat{color:var(--tx-d)}

  .sec{display:flex;align-items:center;gap:11px;margin:26px 2px 13px}
  .sec h2{font-family:var(--disp);font-size:1.15rem;letter-spacing:.04em}
  .sec .rule{flex:1;height:1px;background:var(--line)}
  .note{border:1px solid var(--line);border-radius:14px;padding:15px 16px;background:var(--card);margin-bottom:11px}
  .note-h{font-size:.64rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--pur-br);margin-bottom:6px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:5px 10px;border-radius:8px;
    background:rgba(255,255,255,.05);border:1px solid var(--line-s);color:var(--tx-s);margin:3px 5px 3px 0}
  .chip b{color:var(--gold-br)}
  .tag{font-size:.66rem;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(227,174,51,.10);
    border:1px solid rgba(227,174,51,.28);color:var(--gold-br);margin:2px 4px 2px 0;display:inline-block}
  .vid{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:11px;overflow:hidden;margin-top:10px}
  .vid iframe,.vid video{position:absolute;inset:0;width:100%;height:100%;border:0}
  .vidlink{display:inline-block;margin-top:9px;color:var(--pur-br);font-weight:800;font-size:.85rem;text-decoration:none}
  .msg-from{font-size:.76rem;font-weight:800;color:var(--gold-br)}
  .msg-date{font-size:.7rem;color:var(--tx-d);margin-left:6px}
  .reply{border-left:2px solid var(--line);padding-left:11px;margin-top:10px}
  .inp{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);
    color:#fff;font-size:.9rem;font-weight:500;resize:vertical}
  .inp:focus{outline:none;border-color:var(--pur);background:var(--pur-soft)}
  .empty{text-align:center;padding:34px 16px;color:var(--tx-d);font-size:.9rem}
  .flag{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:150;background:#0d2a1c;
    border:1px solid #1f6b45;color:#7ff0b4;font-weight:800;font-size:.8rem;padding:9px 18px;border-radius:999px;
    opacity:0;transition:.25s;pointer-events:none}
  .flag.show{opacity:1}
  /* top nav — mirrors the Warriors portal */
  .topnav{position:sticky;top:58px;z-index:55;background:rgba(10,6,18,.9);backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line-s)}
  .topnav-in{max-width:680px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
  .topnav-in::-webkit-scrollbar{display:none}
  .nlink{position:relative;display:flex;align-items:center;gap:6px;padding:12px 12px;font-size:.78rem;
    font-weight:800;color:var(--tx-m);white-space:nowrap;border-bottom:2.5px solid transparent;transition:.14s}
  .nlink:hover{color:var(--tx-s)}
  .nlink.on{color:var(--tx);border-bottom-color:var(--pur)}
  .nico{font-size:1rem}
  .nbadge{background:var(--pur);color:#fff;font-size:.62rem;font-weight:900;border-radius:99px;
    padding:1px 6px;min-width:17px;text-align:center}
  .nlink.on .nbadge{background:var(--gold);color:#241233}
  /* compact video row that expands */
  .vrow{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border-radius:13px;
    border:1px solid var(--line);background:var(--card);margin-bottom:9px;transition:.15s;text-align:left}
  .vrow:hover{border-color:rgba(166,107,242,.55);transform:translateX(2px)}
  .vrow.seen{opacity:.62}
  .vthumb{position:relative;width:76px;height:44px;border-radius:8px;overflow:hidden;flex-shrink:0;
    background:#000;display:block}
  .vthumb img{width:100%;height:100%;object-fit:cover;display:block}
  .vph{display:grid;place-items:center;width:100%;height:100%;font-size:1.1rem}
  .vplay{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:.8rem;
    text-shadow:0 2px 6px #000;background:rgba(0,0,0,.2)}
  .vmain{flex:1;min-width:0}
  .vname{display:block;font-weight:800;font-size:.93rem;line-height:1.2}
  .vdesc{display:block;color:var(--tx-d);font-size:.76rem;margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vgo{color:var(--pur-br);font-weight:900;flex-shrink:0}
  .vseen{color:#5ee6a0;font-weight:900;flex-shrink:0}
  .vclose{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);color:var(--tx-m);
    display:grid;place-items:center;flex-shrink:0}
  .vclose:hover{border-color:var(--pur);color:#fff}
  /* welcome message */
  .welcome{border-radius:18px;padding:20px 22px;margin-bottom:14px;
    border:1px solid rgba(227,174,51,.28);
    background:linear-gradient(150deg,rgba(227,174,51,.10),rgba(139,67,224,.10)),var(--card)}
  .wtitle{font-family:var(--disp);font-size:1.55rem;letter-spacing:.02em;line-height:1.05;margin-bottom:9px}
  .wbody p{color:var(--tx-s);font-size:.93rem;margin-bottom:9px}
  .wbody p:last-child{margin-bottom:0}
  /* follow-up progress */
  .follow{border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:var(--card);margin-bottom:6px}
  .frow{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
  .flab{font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-m)}
  .fpct{font-family:var(--disp);font-size:1.6rem;line-height:1}
  .fsub{font-size:.78rem;color:var(--tx-d);margin-top:8px;font-weight:600}
  /* needs attention */
  .todo{display:flex;align-items:center;gap:13px;width:100%;padding:14px 16px;border-radius:14px;
    border:1px solid var(--line);background:var(--card);margin-bottom:10px;transition:.15s;text-align:left}
  .todo:hover{border-color:rgba(166,107,242,.55);transform:translateX(2px)}
  .tdico{font-size:1.35rem;flex-shrink:0}
  .tdmain{flex:1;min-width:0}
  .tdlab{display:block;font-weight:800;font-size:.95rem}
  .tdsub{display:block;color:var(--tx-d);font-size:.79rem;margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tdn{flex-shrink:0;min-width:26px;height:26px;padding:0 8px;border-radius:99px;display:grid;place-items:center;
    background:var(--pur);color:#fff;font-weight:900;font-size:.8rem}
  .allclear{text-align:center;padding:26px 16px;border:1px dashed var(--line);border-radius:16px;margin-bottom:6px}
  .allclear b{font-size:1.05rem}
  /* tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:11px;margin:18px 0 4px}
  .tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:15px 15px;border-radius:15px;
    border:1px solid var(--line);background:var(--card);text-align:left;transition:.15s}
  .tile:hover{border-color:rgba(166,107,242,.55);transform:translateY(-2px)}
  .tico{font-size:1.5rem;margin-bottom:3px}
  .tlab{font-weight:800;font-size:.98rem}
  .tsub{font-size:.76rem;color:var(--tx-d);font-weight:600}
  /* playbook rows + reading view */
  .docrow{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;border-radius:14px;
    border:1px solid var(--line);background:var(--card);margin-bottom:10px;transition:.15s}
  .docrow:hover{border-color:rgba(166,107,242,.5)}
  .docttl{display:block;font-weight:800;font-size:1rem}
  .docsum{display:block;color:var(--tx-m);font-size:.83rem;margin-top:3px}
  .docgo{color:var(--pur-br);font-weight:800;font-size:.8rem;white-space:nowrap}
  .doc{border:1px solid var(--line);border-radius:15px;background:var(--card);padding:20px 22px;line-height:1.65}
  .doc h3{font-family:var(--disp);font-size:1.2rem;letter-spacing:.02em;margin:18px 0 8px;color:var(--gold-br)}
  .doc h4{font-size:.95rem;font-weight:800;margin:15px 0 6px;color:var(--pur-br)}
  .doc h5{font-size:.86rem;font-weight:800;margin:12px 0 5px;color:var(--tx-s)}
  .doc h3:first-child,.doc h4:first-child{margin-top:0}
  .doc p{margin:0 0 11px;color:var(--tx-s)}
  .doc ul{margin:0 0 13px;padding-left:20px;color:var(--tx-s)}
  .doc li{margin-bottom:6px}
  .doc b{color:#fff}
  .doc blockquote{margin:14px 0;padding:12px 16px;border-left:3px solid var(--gold);
    background:rgba(227,174,51,.07);border-radius:0 10px 10px 0;color:var(--tx-s);font-style:italic}
  .defs{display:flex;flex-direction:column;gap:11px;margin:4px 0 14px}
  .def{display:flex;gap:12px;align-items:flex-start}
  .defn{flex-shrink:0;width:25px;height:25px;border-radius:8px;display:grid;place-items:center;
    background:rgba(139,67,224,.18);border:1px solid rgba(166,107,242,.35);
    color:var(--pur-br);font-weight:900;font-size:.76rem}
  .deft{font-weight:800;color:var(--gold-br);letter-spacing:.01em}
  .defd{color:var(--tx-s);font-size:.9rem;margin-top:2px}
  .chkro{width:24px;height:24px;flex-shrink:0;border-radius:7px;border:2px solid var(--line);
    background:rgba(255,255,255,.03);color:#fff;font-weight:900;font-size:.9rem;display:grid;place-items:center}
  .chkro.on{background:linear-gradient(135deg,#2f9e6a,#1f7d51);border-color:transparent}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:9px}
  .stat{border:1px solid var(--line);border-radius:11px;padding:11px 8px;text-align:center;background:var(--card)}
  .stat b{font-family:var(--disp);font-size:1.4rem;display:block;color:var(--gold-br)}
  .stat span{font-size:.6rem;font-weight:800;letter-spacing:.1em;color:var(--tx-d);text-transform:uppercase}
</style>
</head>
<body>
<div id="app"><div class="empty">Loading…</div></div>
<div id="flag" class="flag">✓ Sent</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';
const SB_URL='https://vlcpgwxeybpzwidjackz.supabase.co';
const SB_KEY='sb_publishable_gtHRqI4H2q9VwyE7sG0BKA_qJSXkJMU';
const sb=createClient(SB_URL,SB_KEY);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const KEY='jag_parent_code';

const S={player:null,attrs:[],tests:[],weights:[],norms:[],results:[],snaps:[],players:[],
  drills:[],assigns:[],groups:[],members:[],comments:[],replies:[],stats:[],games:[],
  coachScores:[],settings:{},objectives:[],tasks:[],lists:[],listItems:[],itemState:[],videos:[],docs:[],welcome:[],reads:[],
  view:'home',openDoc:null,openCat:null,openVid:null};

function flag(m){const f=$('flag');f.textContent=m||'✓ Sent';f.classList.add('show');
  clearTimeout(flag._t);flag._t=setTimeout(()=>f.classList.remove('show'),1400);}

/* A stable code derived from the player id — mirrors the coach app so codes
   work even before the pd_access table exists. An issued code always wins. */
function derivedCode(pid){
  const s=String(pid||''); let h=2166136261;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let n=Math.abs(h),o='';
  for(let i=0;i<4;i++){o+=A[n%A.length];n=Math.floor(n/A.length);}
  return 'JAG-'+o;
}

/* ---------- load ---------- */
async function loadFor(code){
  code=String(code||'').trim().toUpperCase();
  let pid=null;
  // 1) an explicitly issued code, if that table exists
  try{
    const {data:acc,error}=await sb.from('pd_access').select('*').eq('code',code).is('revoked_at',null).limit(1);
    if(!error&&acc&&acc.length) pid=acc[0].player_id;
  }catch(e){}
  // 2) otherwise match against the code derived from each player id
  if(!pid){
    const {data:ps}=await sb.from('tryout_players').select('id');
    const m=(ps||[]).find(x=>derivedCode(x.id)===code);
    if(m) pid=m.id;
  }
  if(!pid) return false;
  const q=(t)=>sb.from(t).select('*');
  const r=await Promise.all([
    sb.from('tryout_players').select('*').eq('id',pid).single(),
    q('pd_attributes'),q('pd_tests'),q('pd_test_weights'),q('pd_norms'),q('pd_results'),
    q('pd_snapshots'),q('tryout_players'),q('tryout_drills'),q('pd_assignments'),
    q('pd_groups'),q('pd_group_members'),q('pd_comments'),q('pd_replies'),
    q('pd_stats'),q('pd_games'),q('tryout_scores'),q('pd_settings'),
    q('pd_objectives'),q('pd_tasks'),q('pd_lists'),q('pd_list_items'),q('pd_item_state'),
    sb.from('training_videos').select('*').neq('category','fullgame'),
    sb.from('training_documents').select('*'),
    q('pd_welcome'),q('pd_message_reads')]);
  S.player=r[0].data;
  S.attrs=r[1].data||[];S.tests=r[2].data||[];S.weights=r[3].data||[];S.norms=r[4].data||[];
  S.results=r[5].data||[];S.snaps=r[6].data||[];S.players=r[7].data||[];S.drills=r[8].data||[];
  S.assigns=r[9].data||[];S.groups=r[10].data||[];S.members=r[11].data||[];
  S.comments=r[12].data||[];S.replies=r[13].data||[];S.stats=r[14].data||[];S.games=r[15].data||[];
  S.coachScores=r[16].data||[];
  const set={};(r[17].data||[]).forEach(x=>set[x.key]=x.value);S.settings=set;
  S.objectives=r[18].data||[];S.tasks=r[19].data||[];S.lists=r[20].data||[];S.listItems=r[21].data||[];S.itemState=r[22].data||[];
  S.videos=r[23].data||[];S.docs=r[24].data||[];S.welcome=r[25].data||[];S.reads=r[26].data||[];
  return !!S.player;
}

/* ---------- rating engine (mirrors the coach app) ---------- */
const SC=()=>Object.assign({mid:70,spread:10,floor:35,cap:99,k:10},S.settings.scale||{});
const activeAttrs=()=>S.attrs.filter(a=>a.is_active!==false).sort((a,b)=>(a.sort_idx??0)-(b.sort_idx??0));
const activeTests=()=>S.tests.filter(t=>t.is_active!==false).sort((a,b)=>(a.sort_idx??0)-(b.sort_idx??0));
/* ratings compare an athlete against peers — either their school grade or their team */
function cohortMode(){return (S.settings&&S.settings.cohort)||'grade';}
function teamsOf(pid){return S.members.filter(m=>m.player_id===pid).map(m=>m.group_id);}
function cohortPeers(player){
  if(!player)return [];
  if(cohortMode()==='team'){
    const t=teamsOf(player.id);
    if(t.length) return S.players.filter(x=>teamsOf(x.id).some(g=>t.includes(g)));
    return [];   // no team set -> fall through to the program baseline
  }
  return S.players.filter(x=>x.grade===player.grade);
}
function cohortName(player){
  if(cohortMode()==='team'){
    const t=teamsOf(player.id).map(id=>(S.groups.find(g=>g.id===id)||{}).name).filter(Boolean);
    return t.length?t.join(' / '):'no team';
  }
  return 'grade '+(player.grade==null?'–':player.grade);
}
function latestResult(pid,tk){const rs=S.results.filter(r=>r.player_id===pid&&r.test_key===tk)
  .sort((a,b)=>String(b.tested_at).localeCompare(String(a.tested_at)));return rs.length?rs[0]:null;}
function priorResult(pid,tk){const rs=S.results.filter(r=>r.player_id===pid&&r.test_key===tk)
  .sort((a,b)=>String(b.tested_at).localeCompare(String(a.tested_at)));return rs.length>1?rs[1]:null;}
function stats(vals){if(!vals.length)return{n:0,mean:0,sd:0};
  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  const sd=vals.length>1?Math.sqrt(vals.reduce((s,v)=>s+(v-mean)**2,0)/(vals.length-1)):0;
  return{n:vals.length,mean,sd};}
const cohort=(tk,player)=>stats(cohortPeers(player).map(p=>latestResult(p.id,tk)).filter(Boolean).map(r=>+r.value));
const poolStats=tk=>stats(S.players.map(p=>latestResult(p.id,tk)).filter(Boolean).map(r=>+r.value));
function testRating(tk,player,value){
  const t=S.tests.find(x=>x.key===tk); if(!t||value==null||isNaN(value))return null;
  const sc=SC(), flip=t.lower_is_better?-1:1;
  const c=cohort(tk,player), pool=poolStats(tk);
  const nm=S.norms.find(n=>n.test_key===tk&&+n.grade===+(player&&player.grade));
  let zBase=0;
  if(nm&&+nm.sd>0) zBase=((value-+nm.mean)/+nm.sd)*flip;
  else if(pool.n>2&&pool.sd>0) zBase=((value-pool.mean)/pool.sd)*flip;
  const zGrade=(c.n>3&&c.sd>0)?((value-c.mean)/c.sd)*flip:null;
  const k=+sc.k||10,n=c.n;
  const z=zGrade==null?zBase:zGrade*(n/(n+k))+zBase*(k/(n+k));
  return Math.max(sc.floor,Math.min(sc.cap,Math.round(sc.mid+sc.spread*z)));
}
const coachTo100=s=>Math.round(40+(s-1)*(60/9));
function coachAvg(pid,k){const v=S.coachScores.filter(s=>s.player_id===pid&&s.category===k).map(s=>+s.value);
  return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}
function attrRating(pid,key){
  const p=S.player,a=S.attrs.find(x=>x.key===key); if(!p||!a)return{rating:null};
  let num=0,den=0;
  S.weights.filter(w=>w.attribute_key===key).forEach(w=>{
    const r=latestResult(pid,w.test_key); if(!r)return;
    const rt=testRating(w.test_key,p,+r.value); if(rt==null)return;
    num+=rt*+w.weight; den+=+w.weight;});
  const cw=+a.coach_weight||0;
  if(cw>0){const cs=coachAvg(pid,key); if(cs!=null){num+=coachTo100(cs)*cw; den+=cw;}}
  return den>0?{rating:Math.round(num/den)}:{rating:null};
}
function ovrOf(pid){
  const rt={};let num=0,den=0;
  activeAttrs().forEach(a=>{const r=attrRating(pid,a.key);rt[a.key]=r;
    if(r.rating!=null){num+=r.rating*(+a.weight||1);den+=(+a.weight||1);}});
  return{ovr:den>0?Math.round(num/den):null,ratings:rt};
}
function lastSnap(pid){const s=S.snaps.filter(x=>x.player_id===pid)
  .sort((a,b)=>String(b.as_of).localeCompare(String(a.as_of)));return s.length?s[0]:null;}
function deltaFor(pid,key,cur){const s=lastSnap(pid);if(!s||cur==null)return null;
  const prev=key==='ovr'?s.ovr:(s.attributes_json||{})[key];
  return prev==null?null:Math.round(cur-prev);}

/* NOTE: don't use upsert here. pd_item_state's video_id uniqueness is a *partial*
   index, which PostgREST can't target with on_conflict (returns 400), so the write
   silently failed while the UI showed it watched. Find-then-insert/update instead. */
async function markWatched(mid){
  if(!S.player||!mid||hasWatchedMid(mid))return;
  const [k,id]=String(mid).split(':');
  const row={player_id:S.player.id,status:'watched',completed_at:new Date().toISOString()};
  if(k==='v')row.video_id=id; else row.drill_id=id;
  let q=sb.from('pd_item_state').select('id').eq('player_id',S.player.id);
  q = k==='v' ? q.eq('video_id',id) : q.eq('drill_id',id);
  const {data:ex}=await q.limit(1);
  let saved=null;
  if(ex&&ex.length){
    const {error}=await sb.from('pd_item_state').update(row).eq('id',ex[0].id);
    if(error){console.error('watch update failed',error);return;}
    saved=Object.assign({id:ex[0].id},row);
  }else{
    const {data,error}=await sb.from('pd_item_state').insert(row).select().single();
    if(error){console.error('watch insert failed',error);return;}
    saved=data||row;
  }
  S.itemState.push(saved);
  renderPortal(); flag('✓ Marked watched');
}

  const g=ln.length, sum=k=>ln.reduce((a,b)=>a+(+b[k]||0),0);
  const f=x=>(Math.round(x*10)/10).toFixed(1);
  return '<div class="hero '+(ovr>=90?'elite':'')+'">'+

      '</div>'+
      '<div class="bars">'+activeAttrs().map(a=>{const val=ratings[a.key]?ratings[a.key].rating:null;
        return '<div class="brow"><span class="blab">'+esc(a.label)+'</span>'+
          '<span class="btrack"><i class="bfill" style="width:'+(val==null?0:val)+'%;background:'+ratingColor(val)+'"></i></span>'+

    '<p style="color:var(--tx-d);font-size:.78rem;margin:-6px 2px 6px">Ratings are 0–100 compared with athletes <b>in the same grade</b>. Growth matters more than the number.</p>'+
    (gains.length?'<div class="sec"><h2>PROGRESS</h2><div class="rule"></div></div>'+
      '<div class="note"><div class="note-h">Improvement since last test</div>'+
        gains.map(x=>'<span class="chip">'+esc(x.t.label)+' <b style="color:'+(x.better?'#5ee6a0':'#ff8f6b')+'">'+x.from+' → '+x.to+'</b></span>').join('')+'</div>':'')+

      '<div class="statgrid">'+
        '<div class="stat"><b>'+g+'</b><span>GP</span></div>'+
        '<div class="stat"><b>'+f(sum('pts')/g)+'</b><span>PPG</span></div>'+
        '<div class="stat"><b>'+f((sum('oreb')+sum('dreb'))/g)+'</b><span>RPG</span></div>'+
        '<div class="stat"><b>'+f(sum('ast')/g)+'</b><span>APG</span></div>'+
        '<div class="stat"><b>'+f(sum('stl')/g)+'</b><span>SPG</span></div>'+
        '<div class="stat"><b>'+(sum('fga')?f(100*sum('fgm')/sum('fga'))+'%':'–')+'</b><span>FG%</span></div>'+

}

          '</div></div>'+
        (m?videoEmbed(m.url,m.mid):'')+

function docRow(d){

/* Renders the playbook bodies the coaching staff actually write:
   ALL-CAPS section headers, numbered TERM lines with an indented definition
   underneath, quotes, bullets, and plain paragraphs. */
function docHTML(body){
  const raw=String(body||'').replace(/\r/g,'').split('\n');
  const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
  let out='',inList=false,inDefs=false;
  const closeList=()=>{if(inList){out+='</ul>';inList=false;}};
  const closeDefs=()=>{if(inDefs){out+='</div>';inDefs=false;}};
  const closeAll=()=>{closeList();closeDefs();};
  const isCapsHead=t=>/^[A-Z0-9][A-Z0-9 '’&/\-—,!?.()]*$/.test(t)&&t.length<=64&&/[A-Z]{2}/.test(t);

  for(let i=0;i<raw.length;i++){
    const line=raw[i];
    const t=line.trim();
    if(!t){continue;}

    // markdown heading
    const h=t.match(/^(#{1,3})\s+(.*)$/);
    if(h){closeAll();out+='<h3>'+inline(h[2])+'</h3>';continue;}

    // numbered term, e.g.  1. BALL!   with an indented definition on the next line
    const num=t.match(/^(\d+)[.)]\s+(.*)$/);
    if(num){
      closeList();
      if(!inDefs){out+='<div class="defs">';inDefs=true;}
      let desc='';
      const nxt=raw[i+1];
      if(nxt&&nxt.trim()&&/^\s{2,}/.test(nxt)&&!/^\s*\d+[.)]/.test(nxt)){desc=nxt.trim();i++;}
      out+='<div class="def"><span class="defn">'+num[1]+'</span><div><div class="deft">'+inline(num[2])+'</div>'+
        (desc?'<div class="defd">'+inline(desc)+'</div>':'')+'</div></div>';
      continue;
    }

    // bullets
    const li=t.match(/^[-*•]\s+(.*)$/);
    if(li){closeDefs();if(!inList){out+='<ul>';inList=true;}out+='<li>'+inline(li[1])+'</li>';continue;}

    // pull-quote
    if(/^[“"']/.test(t)){closeAll();out+='<blockquote>'+inline(t.replace(/^[“"']|[”"']$/g,''))+'</blockquote>';continue;}

    // ALL CAPS section header
    if(isCapsHead(t)){closeAll();out+='<h3>'+inline(t)+'</h3>';continue;}

    // "Term — definition" on one line (e.g. Push — Fast break)
    const dash=t.match(/^(.{2,32}?)\s+[—–]\s+(.+)$/)||t.match(/^(.{2,32}?)\s+-\s+(.+)$/);
    if(dash&&!/[.!?:]$/.test(dash[1])){
      closeList();
      if(!inDefs){out+='<div class="defs">';inDefs=true;}
      out+='<div class="def"><span class="defn">•</span><div><div class="deft">'+inline(dash[1])+'</div>'+
        '<div class="defd">'+inline(dash[2])+'</div></div></div>';
      continue;
    }

    closeAll();out+='<p>'+inline(t)+'</p>';
  }
  closeAll();
  return out||'<p style="color:var(--tx-d)">Nothing written yet.</p>';
}

function secMessages(msgs){
  const p=S.player;
  return '<div class="sec"><h2>FROM YOUR COACH</h2><div class="rule"></div></div>'+
    (msgs.length?msgs.map(c=>{

        '<div style="margin-top:7px;color:var(--tx-s);white-space:pre-line">'+esc(c.body)+'</div>'+
        reps.map(r=>'<div class="reply"><b style="font-size:.78rem;color:var(--pur-br)">'+esc(r.author_name||'You')+'</b>'+
          '<div style="color:var(--tx-s);font-size:.87rem">'+esc(r.body)+'</div></div>').join('')+
        '<div style="margin-top:11px">'+
          '<textarea class="inp" rows="2" placeholder="Reply to your coach…" data-rep="'+c.id+'"></textarea>'+
          '<button class="btn btn-g btn-s" style="margin-top:7px" data-send="'+c.id+'">Send reply</button>'+
        '</div>'+
      '</div>';}).join(''):'<div class="empty">No messages yet.</div>');
}

/* ---------- auto watch detection ---------- */
function attachWatchDetection(){
  // native video: mark at 90% watched
  document.querySelectorAll('video[data-vid]').forEach(v=>{
    if(v._wired)return; v._wired=true;
    v.addEventListener('timeupdate',()=>{
      if(v.duration&&v.currentTime/v.duration>=0.9) markWatched(v.dataset.vid);
    });
  });
  // youtube: poll the iframe player through the IFrame API
  const frames=[...document.querySelectorAll('iframe[data-yt]')].filter(f=>!f._wired);
  if(!frames.length)return;
  const boot=()=>frames.forEach(f=>{
    f._wired=true;
    try{
      const pl=new YT.Player(f.id,{events:{onStateChange:e=>{
        if(e.data===YT.PlayerState.ENDED) markWatched(f.dataset.yt);
        if(e.data===YT.PlayerState.PLAYING){
          clearInterval(f._t);
          f._t=setInterval(()=>{
            try{const d=pl.getDuration(),c=pl.getCurrentTime();
              if(d&&c/d>=0.9){clearInterval(f._t);markWatched(f.dataset.yt);}
            }catch(err){clearInterval(f._t);}
          },2000);
        } else clearInterval(f._t);
      }}});
    }catch(err){}
  });
  if(window.YT&&window.YT.Player){boot();return;}
  if(!window._ytLoading){
    window._ytLoading=true;
    const t=document.createElement('script'); t.src='https://www.youtube.com/iframe_api';
    document.head.appendChild(t);
  }
  const prev=window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady=()=>{ if(prev)try{prev()}catch(e){} boot(); };
}

/* ---------- boot ---------- */
(async()=>{
  let saved=null; try{saved=localStorage.getItem(KEY);}catch(e){}
  if(saved){ const ok=await loadFor(saved); if(ok){renderPortal();return;} }
  renderGate();
})();
